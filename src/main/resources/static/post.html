<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Posts - BlogSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="/front_end/images/download.png.png" type="image/x-icon">
    <style>
        body { background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%); min-height:100vh; color:#f6f2e9; font-family:Arial, Helvetica, sans-serif;}
        .navbar-glass {background: rgba(34,34,34,0.85); backdrop-filter: blur(8px); border-radius:16px; margin:18px auto 32px auto; padding:0.7rem 1.5rem; max-width:1100px;}
        .navbar-brand {font-weight:700; font-size:1.3rem; color:#fd6537 !important; display:flex; align-items:center; gap:10px;}
        .navbar-brand img {width:38px;}
        .nav-link, .btn-nav {color:#fff !important; font-weight:500; margin-right:10px; border-radius:8px; transition:background 0.2s;}
        .btn-nav {background:#fd6537; border:none; padding:8px 18px; display:flex; align-items:center; gap:7px;}
        .btn-nav:hover, .nav-link:hover {background:#ff835e; color:#fff !important;}
        .btn-logout {background:#333; color:#fd6537 !important; border:none; padding:8px 18px; border-radius:8px; display:flex; align-items:center; gap:7px;}
        .btn-logout:hover {background:#fd6537; color:#fff !important;}
        .glassy-card {background: rgba(255,255,255,0.13); border-radius:18px; box-shadow:0 8px 32px rgba(0,0,0,0.37); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.18); padding:2rem 1.5rem; margin-bottom:2rem;}
        .glassy-btn {background:#fd6537; color:#fff; border:none; border-radius:8px; padding:10px 22px; font-weight:600; transition:background 0.2s;}
        .glassy-btn:hover {background:#ff835e;}
        .post-image {max-width:200px; max-height:200px; object-fit:cover; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,0.2);}
        .engagement {font-size:0.95em; color:#fd6537;}
        .modal-content {background: rgba(34,34,34,0.95); color:#fff; border-radius:16px; border:1px solid #fd6537;}
        .modal-header, .modal-footer {border:none;}
        .form-label {color:#fd6537; font-weight:500;}
        .form-control {background: rgba(255,255,255,0.07); color:#fff; border:1px solid #fd6537; border-radius:8px;}
        .form-control:focus {background: rgba(255,255,255,0.15); border-color:#ff835e; color:#fff;}
        @media (max-width: 600px) {
            .navbar-glass {padding:0.5rem 0.7rem;}
            .navbar-brand img {width:28px;}
            .btn-nav, .btn-logout {padding:6px 12px; font-size:0.95em;}
            .glassy-card {padding:1rem 0.5rem;}
            .post-image {max-width:120px; max-height:120px;}
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-glass">
    <div class="container-fluid">
        <a class="navbar-brand" href="/index.html">
            <img src="/front_end/images/download.png.png" alt="BlogSphere Icon">
            BlogSphere
        </a>
        <div class="d-flex">
            <a href="/published-posts.html" class="btn btn-nav"><i class="fa-solid fa-list"></i> Published Posts</a>
            <button id="logoutBtn" class="btn btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h1 class="mb-4 text-center" style="color:#fd6537; font-weight:700;">My Posts</h1>

    <!-- Create Post Form -->
    <div class="glassy-card">
        <h5 class="mb-3" style="color:#fd6537;">Create New Post</h5>
        <form id="postForm" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="content" class="form-label">Content</label>
                <textarea id="content" class="form-control" rows="4" required></textarea>
            </div>
            <div class="mb-3">
                <label for="image" class="form-label">Image (optional)</label>
                <input type="file" id="image" class="form-control" accept="image/*">
            </div>
            <button type="submit" class="glassy-btn">Submit Post</button>
        </form>
        <div id="postError" class="text-danger mt-2" style="display:none"></div>
        <div id="postSuccess" class="text-success mt-2" style="display:none"></div>
    </div>

    <!-- User's Posts List -->
    <div id="postsList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const BASE_URL = 'http://localhost:8080/api/posts';

    function getToken() {
        return localStorage.getItem('token');
    }

    function getAuthHeaders() {
        const token = getToken();
        return token ? { 'Authorization': 'Bearer ' + token } : {};
    }

    async function loadMyPosts() {
        try {
            const response = await fetch(`${BASE_URL}/me/posts`, {
                headers: getAuthHeaders()
            });
            if (!response.ok) throw new Error("Failed to fetch");
            const result = await response.json();
            const postsList = document.getElementById('postsList');
            const posts = result.data || [];
            if(posts.length === 0) {
                postsList.innerHTML = `<div class="alert alert-info">You have not created any posts yet.</div>`;
                return;
            }
            postsList.innerHTML = posts.map(post => `
                <div class="card glassy-card mb-3">
                    <div class="card-body">
                        <h5 class="card-title" style="color:#fd6537;">${post.title}</h5>
                        <p class="card-text"><small>${new Date(post.createdDate).toLocaleString()}</small></p>
                        ${post.imagePath ? `<img src="/uploads/${post.imagePath}" class="post-image mb-2" alt="Post Image">` : ''}
                        <p class="card-text">${post.content}</p>
                    </div>
                </div>
            `).join('');
        } catch (error) {
            document.getElementById('postsList').innerHTML = `<div class="alert alert-danger">Failed to load your posts.</div>`;
        }
    }

    document.getElementById('postForm').addEventListener('submit', async function(e){
        e.preventDefault();
        document.getElementById('postError').style.display = 'none';
        document.getElementById('postSuccess').style.display = 'none';

        const title = document.getElementById('title').value.trim();
        const content = document.getElementById('content').value.trim();
        const image = document.getElementById('image').files[0];

        if(!title || !content){
            document.getElementById('postError').textContent = 'Title and content are required.';
            document.getElementById('postError').style.display = 'block';
            return;
        }

        const formData = new FormData();
        formData.append('title', title);
        formData.append('content', content);
        formData.append('createdDate', new Date().toISOString());
        if(image) formData.append('image', image);

        try {
            const response = await fetch(BASE_URL, {
                method: 'POST',
                headers: getAuthHeaders(),   // ✅ include Authorization header
                body: formData
            });
            const result = await response.json();
            if(response.ok){
                document.getElementById('postSuccess').textContent = 'Post created successfully!';
                document.getElementById('postSuccess').style.display = 'block';
                document.getElementById('postForm').reset();
                loadMyPosts();
            } else {
                document.getElementById('postError').textContent = result.message || 'Failed to create post.';
                document.getElementById('postError').style.display = 'block';
            }
        } catch(err){
            document.getElementById('postError').textContent = 'Error submitting post.';
            document.getElementById('postError').style.display = 'block';
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', function(){
        localStorage.removeItem('token');
        window.location.href = '/index.html';
    });

    document.addEventListener('DOMContentLoaded', loadMyPosts);
</script>
</body>
</html>
