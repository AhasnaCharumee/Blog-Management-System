<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - BlogSphere</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="icon" href="/front_end/images/download.png.png" type="image/x-icon">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .container {
            max-width: 400px;
            margin-top: 60px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h2 {
            color: #fd6537;
        }
        .btn-google {
            background: #ea4335;
            color: #fff;
            font-weight: 500;
            margin-top: 10px;
        }
        .btn-google:hover {
            background: #c23321;
        }
        .form-label {
            color: #fd6537;
        }
        a {
            color: #4285f4;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .icon-google {
            vertical-align: middle;
            margin-right: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="text-center mb-3">
        <img src="/front_end/images/download.png.png" style="max-width: 80px;">
    </div>
    <h2 class="mb-4 text-center">Login</h2>
    <form id="adminLoginForm">
        <div class="mb-3">
            <label for="adminEmail" class="form-label">Email address</label>
            <input type="email" class="form-control" id="adminEmail" name="email" required>
        </div>
        <div class="mb-3">
            <label for="adminPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="adminPassword" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login as Admin</button>
    </form>
    <div class="mt-3">
        <a href="http://localhost:8080/oauth2/authorization/google" class="btn btn-google w-100">
            <svg class="icon-google" width="20" height="20" viewBox="0 0 48 48">
                <g>
                    <path fill="#4285F4" d="M44.5 20H24v8.5h11.7C34.7 33.1 30.1 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.1 8.1 2.9l6.1-6.1C34.5 6.5 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.2-4z"/>
                    <path fill="#34A853" d="M6.3 14.7l7 5.1C15.5 16.1 19.4 13 24 13c3.1 0 5.9 1.1 8.1 2.9l6.1-6.1C34.5 6.5 29.6 4 24 4c-7.2 0-13.4 4.1-16.7 10.7z"/>
                    <path fill="#FBBC05" d="M24 44c5.6 0 10.5-1.9 14.3-5.1l-6.6-5.4C29.7 35.5 27 36.5 24 36.5c-6.1 0-10.7-2.9-13.7-7.1l-7 5.4C6.6 39.9 14.1 44 24 44z"/>
                    <path fill="#EA4335" d="M44.5 20H24v8.5h11.7c-1.2 3.2-4.1 5.5-7.7 5.5-4.6 0-8.4-3.8-8.4-8.5s3.8-8.5 8.4-8.5c2.5 0 4.7.9 6.3 2.4l6.1-6.1C38.9 10.1 32.1 7 24 7c-8.1 0-15.1 4.7-18.7 11.7l7 5.1C15.5 16.1 19.4 13 24 13c3.1 0 5.9 1.1 8.1 2.9l6.1-6.1C34.5 6.5 29.6 4 24 4c-7.2 0-13.4 4.1-16.7 10.7z"/>
                </g>
            </svg>
            Login with Google
        </a>
    </div>
    <p class="mt-3 text-center">Don't have an account? <a href="/register.html">Register</a></p>
    <div id="errorMessage" class="text-danger mt-2" style="display:none;"></div>
</div>

<script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('adminEmail').value;
        const password = document.getElementById('adminPassword').value;
        const errorMessage = document.getElementById('errorMessage');

        const response = await fetch('http://localhost:8080/api/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
        });

        if (response.ok) {
            const data = await response.json();
            localStorage.setItem('token', data.data); // Store token
            window.location.href = 'admin.html';        } else {
            const error = await response.json();
            errorMessage.textContent = 'Login failed: ' + error.message;
            errorMessage.style.display = 'block';
        }
    });
</script>
</body>
</html>
