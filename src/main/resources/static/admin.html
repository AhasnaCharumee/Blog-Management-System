<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      min-height: 100vh;
      color: #f6f2e9;
      font-family: Arial, Helvetica, sans-serif;
    }
    /* Keep your previous CSS here */

    /* Chatbot Widget Styles */
    .chatbot-widget {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 300px;
      background: #2d2d2d;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      overflow: hidden;
      font-size: 14px;
      z-index: 9999;
    }
    .chat-header {
      background: #007bff;
      color: white;
      padding: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    .chat-body {
      display: none;
      flex-direction: column;
      height: 350px;
    }
    .chat-messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      background: #1a1a1a;
      color: #f6f2e9;
    }
    .chat-message {
      margin-bottom: 10px;
      padding: 6px 10px;
      border-radius: 8px;
      max-width: 80%;
    }
    .user-message {
      background: #007bff;
      color: white;
      margin-left: auto;
    }
    .ai-message {
      background: #444;
      color: #f6f2e9;
      margin-right: auto;
    }
    .chat-input-container {
      display: flex;
      border-top: 1px solid #444;
    }
    .chat-input {
      flex: 1;
      border: none;
      padding: 10px;
      background: #2d2d2d;
      color: white;
    }
    .chat-input:focus {
      outline: none;
    }
    .chat-send {
      border: none;
      background: #007bff;
      color: white;
      padding: 0 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <nav class="navbar navbar-expand-lg navbar-glass">
    <div class="container-fluid">
      <a class="navbar-brand" href="/index.html">
        <img src="/front_end/images/download.png.png" alt="BlogSphere Icon">
        BlogSphere Admin
      </a>
      <div class="d-flex">
        <a href="/published-posts.html" class="btn btn-nav">
          <i class="fa-solid fa-list"></i> Published Posts
        </a>
        <form action="/logout" method="post" style="display:inline;">
          <button type="submit" class="btn btn-logout">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </button>
        </form>
      </div>
    </div>
  </nav>
  <div class="row">
    <!-- Sidebar -->
    <nav class="col-md-2 d-none d-md-block bg-dark sidebar text-white">
      <div class="position-sticky pt-3">
        <h4 class="text-center py-3">Admin Panel</h4>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link text-white" href="#">🏠 Dashboard</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#">👤 Users</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#">📝 Posts</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#">💬 Comments</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#">🔓 Logout</a></li>
        </ul>
        <div class="mt-5 px-3">
          <hr class="text-white"/>
          <p>👨 Admin: Admin User</p>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="col-md-10 ms-sm-auto px-md-4 main-content">
      <h2 class="mb-4">Dashboard</h2>

      <!-- Stat Cards -->
      <div class="row g-4 mb-5">
        <div class="col-md-4">
          <div class="card p-3 stat-card-posts">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h3 id="totalPostsCount">0</h3>
                <p class="mb-0">Total Posts</p>
              </div>
              <i class="fas fa-pencil-alt fa-3x"></i>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-3 stat-card">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h3 id="pendingPostsCount">0</h3>
                <p class="mb-0">Pending Posts</p>
              </div>
              <i class="fas fa-hourglass-half fa-3x"></i>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-3 stat-card-users">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h3 id="approvedPostsCount">0</h3>
                <p class="mb-0">Approved Posts</p>
              </div>
              <i class="fas fa-check-circle fa-3x"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Charts -->
      <div class="row g-4 mb-5">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Post Status Overview</div>
            <div class="card-body chart-container">
              <canvas id="pieChart"></canvas>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Posts per Author</div>
            <div class="card-body chart-container">
              <canvas id="barChart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- Posts Table -->
      <div class="card">
        <div class="card-header">All Posts</div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped table-hover">
              <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
              </thead>
              <tbody>
              <!-- Posts will be dynamically added here -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Chatbot Widget -->
<div id="chatbot-widget" class="chatbot-widget">
  <div class="chat-header" onclick="toggleChat()">
    🤖 AI Assistant <span id="chat-toggle">▲</span>
  </div>
  <div id="chat-body" class="chat-body">
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-container">
      <input type="text" id="chat-input" class="chat-input" placeholder="Type a message..." />
      <button onclick="sendChatMessage()" class="chat-send">Send</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<script>
  const ADMIN_POSTS_URL = "http://localhost:8080/api/admins/posts";
  const ADMIN_API_BASE = "http://localhost:8080/api/admins";
  let pieChart, barChart;

  function getAuthHeaders() {
    return {
      'Authorization': 'Bearer ' + localStorage.getItem('token'),
      'Content-Type': 'application/json'
    };
  }

  async function loadAdminDashboard() {
    await loadAdminPosts();
  }

  async function loadAdminPosts() {
    try {
      const response = await fetch(ADMIN_POSTS_URL, {
        headers: getAuthHeaders()
      });
      if (!response.ok) throw new Error("Failed to fetch posts");
      const data = await response.json();
      const posts = data.data || [];

      const totalPostsCount = posts.length;
      const approvedPostsCount = posts.filter(p => p.status === 'APPROVED').length;
      const pendingPostsCount = posts.filter(p => p.status === 'PENDING').length;

      document.getElementById('totalPostsCount').textContent = totalPostsCount;
      document.getElementById('approvedPostsCount').textContent = approvedPostsCount;
      document.getElementById('pendingPostsCount').textContent = pendingPostsCount;

      const tbody = document.querySelector("table tbody");
      tbody.innerHTML = posts.map(post => `
        <tr>
          <td>${post.id}</td>
          <td>${post.title}</td>
          <td>${post.author}</td>
          <td>
            <span class="badge bg-${post.status === 'PENDING' ? 'warning' : post.status === 'APPROVED' ? 'success' : 'danger'}">
              ${post.status.charAt(0) + post.status.slice(1).toLowerCase()}
            </span>
          </td>
          <td>
            ${post.status === 'PENDING' ? `
              <button class="btn btn-success btn-sm me-2" onclick="approvePost(${post.id})">Approve</button>
              <button class="btn btn-danger btn-sm" onclick="rejectPost(${post.id})">Reject</button>
            ` : ''}
          </td>
        </tr>
      `).join('');

      renderPieChart(approvedPostsCount, pendingPostsCount, totalPostsCount - approvedPostsCount - pendingPostsCount);
      renderBarChart(posts);

    } catch (error) {
      console.error("Error loading admin posts:", error);
      document.querySelector("table tbody").innerHTML = `<tr><td colspan="5" class="text-center">Failed to load posts.</td></tr>`;
    }
  }

  function renderPieChart(approved, pending, rejected) {
    const ctx = document.getElementById('pieChart').getContext('2d');
    if (pieChart) pieChart.destroy();
    pieChart = new Chart(ctx, {
      type: 'pie',
      data: {
        labels: ['Approved', 'Pending', 'Rejected'],
        datasets: [{
          data: [approved, pending, rejected],
          backgroundColor: [
            'rgba(40, 167, 69, 0.8)',
            'rgba(255, 193, 7, 0.8)',
            'rgba(220, 53, 69, 0.8)'
          ],
          borderColor: [
            'rgba(40, 167, 69, 1)',
            'rgba(255, 193, 7, 1)',
            'rgba(220, 53, 69, 1)'
          ],
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'top' },
          tooltip: {
            callbacks: {
              label: function(context) {
                const label = context.label || '';
                const value = context.parsed || 0;
                const total = context.dataset.data.reduce((acc, val) => acc + val, 0);
                const percentage = ((value / total) * 100).toFixed(2);
                return `${label}: ${value} (${percentage}%)`;
              }
            }
          }
        }
      }
    });
  }

  function renderBarChart(posts) {
    const authors = {};
    posts.forEach(post => {
      authors[post.author] = (authors[post.author] || 0) + 1;
    });
    const authorNames = Object.keys(authors);
    const postCounts = Object.values(authors);
    const ctx = document.getElementById('barChart').getContext('2d');
    if (barChart) barChart.destroy();
    barChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: authorNames,
        datasets: [{
          label: 'Posts Count',
          data: postCounts,
          backgroundColor: 'rgba(54, 162, 235, 0.8)',
          borderColor: 'rgba(54, 162, 235, 1)',
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true,
            title: { display: true, text: 'Number of Posts' }
          },
          x: {
            title: { display: true, text: 'Author' }
          }
        },
        plugins: { legend: { display: false } }
      }
    });
  }

  async function approvePost(id) {
    try {
      await fetch(`${ADMIN_API_BASE}/${id}/approve`, {
        method: "PUT",
        headers: getAuthHeaders()
      });
      await loadAdminPosts();
    } catch (error) {
      console.error("Failed to approve post:", error);
    }
  }

  async function rejectPost(id) {
    try {
      await fetch(`${ADMIN_API_BASE}/${id}/reject`, {
        method: "PUT",
        headers: getAuthHeaders()
      });
      await loadAdminPosts();
    } catch (error) {
      console.error("Failed to reject post:", error);
    }
  }

  // Chatbot functions
  function toggleChat() {
    const chatBody = document.getElementById("chat-body");
    const toggleIcon = document.getElementById("chat-toggle");
    if (chatBody.style.display === "flex") {
      chatBody.style.display = "none";
      toggleIcon.textContent = "▲";
    } else {
      chatBody.style.display = "flex";
      toggleIcon.textContent = "▼";
    }
  }

  async function sendChatMessage() {
    const input = document.getElementById("chat-input");
    const messagesDiv = document.getElementById("chat-messages");
    const message = input.value.trim();
    if (!message) return;

    messagesDiv.innerHTML += `<div class="chat-message user-message">${message}</div>`;
    input.value = "";
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    try {
      const response = await fetch("http://localhost:8080/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message })  // ✅ send JSON object
      });


      const aiReply = await response.text();
      messagesDiv.innerHTML += `<div class="chat-message ai-message">${aiReply}</div>`;
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

    } catch (err) {
      console.error("Chatbot error:", err);
      messagesDiv.innerHTML += `<div class="chat-message ai-message">⚠️ Error: Could not reach AI service.</div>`;
    }
  }

  window.onload = loadAdminDashboard;
</script>
</body>
</html>
