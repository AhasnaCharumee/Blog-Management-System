<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .profile-img { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; }
    </style>
</head>
<body>
<div class="container py-4">
    <h1 class="mb-4 text-center">My Account</h1>

    <div id="userInfo" class="text-center mb-4">
        <img id="profileImage" class="profile-img mb-2" src="/uploads/default.png" alt="Profile">
        <h5 id="userName"></h5>
        <p id="userEmail"></p>
        <p id="userBio"></p>
    </div>

    <hr>

    <h3>Edit Profile</h3>
    <form id="editForm" enctype="multipart/form-data">
        <input type="hidden" id="userId">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" id="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Bio</label>
            <textarea id="bio" class="form-control" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Profile Image</label>
            <input type="file" id="profileImageInput" class="form-control" accept="image/*">
        </div>
        <button type="submit" class="btn btn-success">Save Changes</button>
    </form>
</div>

<script>
    const API_BASE = "http://localhost:8080/api/users";

    async function loadUser() {
        const res = await fetch(`${API_BASE}/me`, { credentials: 'include' });
        const user = await res.json();

        document.getElementById('userId').value = user.id;
        document.getElementById('name').value = user.name;
        document.getElementById('email').value = user.email;
        document.getElementById('bio').value = user.bio || '';

        document.getElementById('userName').textContent = user.name;
        document.getElementById('userEmail').textContent = user.email;
        document.getElementById('userBio').textContent = user.bio || '';
        document.getElementById('profileImage').src = user.profileImagePath
            ? `/uploads/${user.profileImagePath}`
            : `/uploads/default.png`;
    }

    document.getElementById('editForm').addEventListener('submit', async function(e){
        e.preventDefault();
        const userId = document.getElementById('userId').value;
        const formData = new FormData();
        formData.append("name", document.getElementById('name').value);
        formData.append("email", document.getElementById('email').value);
        formData.append("bio", document.getElementById('bio').value);
        const imageFile = document.getElementById('profileImageInput').files[0];
        if(imageFile) formData.append("profileImage", imageFile);

        const res = await fetch(`${API_BASE}/update/${userId}`, {
            method: "PUT",
            credentials: 'include',
            body: formData
        });

        if(res.ok) {
            alert("Profile updated successfully");
            loadUser();
        } else {
            const text = await res.text();
            alert("Error: " + text);
        }
    });

    window.onload = loadUser;
</script>
</body>
</html>
