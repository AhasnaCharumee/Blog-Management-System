<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Account - My Posts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .post-image { max-width: 200px; max-height: 200px; object-fit: cover; }
        .engagement { font-size: 0.95em; color: #555; }
    </style>
</head>
<body>
<div class="container py-4">
    <h1 class="mb-4 text-center">My Account</h1>

    <!-- User Info -->
    <div id="userInfo" class="mb-4"></div>

    <h2 class="mb-3 text-center">My Posts</h2>
    <!-- User's Posts List -->
    <div id="postsList"></div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <form id="editPostForm" class="modal-content" enctype="multipart/form-data">
      <div class="modal-header">
        <h5 class="modal-title">Edit Post</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editPostId">
        <div class="mb-3">
          <label for="editTitle" class="form-label">Title</label>
          <input type="text" class="form-control" id="editTitle" required>
        </div>
        <div class="mb-3">
          <label for="editContent" class="form-label">Content</label>
          <textarea class="form-control" id="editContent" rows="3" required></textarea>
        </div>
        <div class="mb-3">
          <label for="editImage" class="form-label">Change Image</label>
          <input type="file" class="form-control" id="editImage" accept="image/*">
        </div>
        <div id="editImagePreview" class="mb-2"></div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-success">Save Changes</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const BASE_URL = 'http://localhost:8080/api/posts';
    // Fetch and display user info after login
    async function loadUserInfo() {
        try {
            const response = await fetch('http://localhost:8080/api/users/me', { credentials: 'include' });
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const user = await response.json();
            console.log('User data:', user); // Add for debugging
            if (!user) {
                document.getElementById('userInfo').innerHTML = '<div class="alert alert-danger">User info not found.</div>';
                return;
            }
            document.getElementById('userInfo').innerHTML = `
            <div>
                <h5>Welcome, ${user.name}</h5>
                <p>Email: ${user.email}</p>
            </div>
        `;
        } catch (error) {
            console.error('Error in loadUserInfo:', error);
            document.getElementById('userInfo').innerHTML = '<div class="alert alert-danger">Failed to load user info.</div>';
        }
    }
    document.addEventListener('DOMContentLoaded', loadUserInfo);

    // Fetch and display user's posts
    async function loadMyPosts() {
        try {
            const response = await fetch(`${BASE_URL}/me/posts`, { credentials: 'include' });
            const posts = await response.json();
            const postsList = document.getElementById('postsList');
            if (!posts.length) {
                postsList.innerHTML = '<div class="alert alert-info">No posts yet.</div>';
                return;
            }
            postsList.innerHTML = posts.map(post => `
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title">${post.title}</h5>
                        <p class="card-text">${post.content}</p>
                        ${post.imagePath ? `<img src="/uploads/${post.imagePath}" class="post-image mb-2">` : ''}
                        <div class="engagement mb-2">
                            👍 ${post.likes} &nbsp; 💬 ${post.commentsCount} &nbsp; 👁️ ${post.views}
                        </div>
                        <button class="btn btn-sm btn-warning edit-btn" data-id="${post.id}">Edit</button>
                        <button class="btn btn-sm btn-danger delete-btn" data-id="${post.id}">Delete</button>
                    </div>
                </div>
            `).join('');
            // Attach event listeners
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = () => deletePost(btn.getAttribute('data-id'));
            });
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.onclick = () => openEditModal(btn.getAttribute('data-id'));
            });
        } catch (error) {
            document.getElementById('postsList').innerHTML = '<div class="alert alert-danger">Failed to load posts.</div>';
        }
    }

    // Delete a post
    async function deletePost(id) {
        if (!confirm('Are you sure you want to delete this post?')) return;
        try {
            await fetch(`${BASE_URL}/${id}`, {
                method: 'DELETE',
                credentials: 'include'
            });
            loadMyPosts();
        } catch {
            alert('Failed to delete post');
        }
    }

    // Edit post modal logic
    let editModal = new bootstrap.Modal(document.getElementById('editModal'));
    async function openEditModal(id) {
        const response = await fetch(`${BASE_URL}/${id}`, { credentials: 'include' });
        const data = await response.json();
        const post = data.data;
        document.getElementById('editPostId').value = post.id;
        document.getElementById('editTitle').value = post.title;
        document.getElementById('editContent').value = post.content;
        document.getElementById('editImagePreview').innerHTML = post.imagePath ? `<img src="/uploads/${post.imagePath}" class="post-image">` : '';
        document.getElementById('editImage').value = '';
        editModal.show();
    }

    // Handle edit post submit
    document.getElementById('editPostForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const id = document.getElementById('editPostId').value;
        const formData = new FormData();
        formData.append('post', new Blob([JSON.stringify({
            title: document.getElementById('editTitle').value,
            content: document.getElementById('editContent').value,
            createdDate: new Date().toISOString()
        })], { type: 'application/json' }));
        const imageInput = document.getElementById('editImage');
        if (imageInput.files[0]) {
            formData.append('image', imageInput.files[0]);
        }
        try {
            await fetch(`${BASE_URL}/${id}`, {
                method: 'PUT',
                credentials: 'include',
                body: formData
            });
            editModal.hide();
            loadMyPosts();
        } catch {
            alert('Failed to update post');
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        loadUserInfo();
        loadMyPosts();
    });
</script>
</body>
</html>
