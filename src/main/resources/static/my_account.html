<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Account - BlogSphere</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="/front_end/images/download.png.png" type="image/x-icon">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .navbar-custom {
            background: rgba(30,30,30,0.95);
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
            padding: 0.7rem 1.5rem;
        }
        .navbar-brand img {
            width: 38px;
            margin-right: 10px;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.3rem;
            color: #fd6537 !important;
            display: flex;
            align-items: center;
        }
        .nav-link, .btn-nav {
            color: #fff !important;
            font-weight: 500;
            margin-right: 10px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .btn-nav {
            background: #fd6537;
            border: none;
            padding: 8px 18px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .btn-nav:hover, .nav-link:hover {
            background: #ff835e;
            color: #fff !important;
        }
        .btn-logout {
            background: #333;
            color: #fd6537 !important;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .btn-logout:hover {
            background: #fd6537;
            color: #fff !important;
        }
        @media (max-width: 600px) {
            .navbar-custom {
                padding: 0.5rem 0.5rem;
            }
            .navbar-brand img {
                width: 28px;
            }
            .btn-nav, .btn-logout {
                padding: 6px 10px;
                font-size: 0.95rem;
            }
        }
        .account-wrapper {
            max-width: 500px;
            margin: 40px auto;
            background: rgba(255,255,255,0.07);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            padding: 2.5rem 2rem;
        }
        .profile-img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #fd6537;
            background: #fff;
        }
        .blogsphere-icon {
            width: 48px;
            margin-bottom: 10px;
        }
        .user-info h5 {
            margin-top: 10px;
            font-size: 1.4rem;
            font-weight: 600;
        }
        .user-info p {
            margin-bottom: 0.5rem;
            color: #d3cfc6;
        }
        .btn-edit {
            background: #fd6537;
            color: #fff;
            font-weight: 500;
            border-radius: 8px;
            padding: 10px 20px;
            margin-top: 10px;
        }
        .btn-edit:hover {
            background: #ff835e;
        }
        .posts-section {
            max-width: 500px;
            margin: 30px auto;
            background: rgba(255,255,255,0.07);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            padding: 1.5rem 1rem;
        }
        .post-card {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-bottom: 1rem;
            padding: 1rem;
            color: #fff;
        }
        .post-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .post-content {
            color: #d3cfc6;
        }
        @media (max-width: 600px) {
            .account-wrapper, .posts-section {
                max-width: 98vw;
                padding: 1.2rem 0.5rem;
            }
            .profile-img {
                width: 80px;
                height: 80px;
            }
            .blogsphere-icon {
                width: 36px;
            }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-custom mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/index.html">
            <img src="/front_end/images/download.png.png" alt="BlogSphere Icon">
            BlogSphere
        </a>
        <div class="d-flex">
            <a href="/post.html" class="btn btn-nav">
                <i class="fa-solid fa-plus"></i> Create New Post
            </a>
            <a href="/published-posts.html" class="btn btn-nav">
                <i class="fa-solid fa-list"></i> All Posts
            </a>
            <form action="/logout" method="post" style="display:inline;">
                <button type="submit" class="btn btn-logout">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </form>
        </div>
    </div>
</nav>
<div class="account-wrapper">
    <div class="text-center">
        <img src="/front_end/images/download.png.png" class="blogsphere-icon" alt="BlogSphere Icon">
        <h1 style="font-size:2rem; font-weight:700; margin-bottom:1.2rem;">My Account</h1>
    </div>
    <div id="userInfo" class="user-info text-center mb-4">
        <img id="profileImage" class="profile-img mb-2" src="/uploads/default.png" alt="Profile">
        <h5 id="userName">User Name</h5>
        <p id="userEmail">user@email.com</p>
        <p id="userBio"></p>
        <button class="btn btn-edit" data-bs-toggle="modal" data-bs-target="#editProfileModal">Edit Profile</button>
    </div>
</div>

<!-- User's Posts Section -->
<div class="posts-section">
    <h3 class="mb-3 text-center" style="color:#fd6537;">Your Posts</h3>
    <div id="userPosts"></div>
</div>

<!-- Edit Profile Modal -->
<div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content" style="background: #222; color: #fff;">
      <div class="modal-header">
        <h5 class="modal-title" id="editProfileModalLabel" style="color:#fd6537;">Edit Profile</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="background: #fff;"></button>
      </div>
      <div class="modal-body">
        <form id="editForm" enctype="multipart/form-data">
            <input type="hidden" id="userId">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Bio</label>
                <textarea id="bio" class="form-control" rows="2"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Profile Image</label>
                <input type="file" id="profileImageInput" class="form-control" accept="image/*">
            </div>
            <button type="submit" class="btn btn-save w-100">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = "http://localhost:8080/api/users";
    const POSTS_API = "http://localhost:8080/api/posts/me/posts";

    async function loadUser() {
        const res = await fetch(`${API_BASE}/me`, { credentials: 'include' });
        if (!res.ok) return;
        const user = await res.json();

        document.getElementById('userId').value = user.id;
        document.getElementById('name').value = user.name;
        document.getElementById('email').value = user.email;
        document.getElementById('bio').value = user.bio || '';

        document.getElementById('userName').textContent = user.name;
        document.getElementById('userEmail').textContent = user.email;
        document.getElementById('userBio').textContent = user.bio || '';
        document.getElementById('profileImage').src = user.profileImagePath
            ? `/uploads/${user.profileImagePath}`
            : `/uploads/default.png`;
    }

    document.getElementById('editForm').addEventListener('submit', async function(e){
        e.preventDefault();
        const userId = document.getElementById('userId').value;
        const formData = new FormData();
        formData.append("name", document.getElementById('name').value);
        formData.append("email", document.getElementById('email').value);
        formData.append("bio", document.getElementById('bio').value);
        const imageFile = document.getElementById('profileImageInput').files[0];
        if(imageFile) formData.append("profileImage", imageFile);

        const res = await fetch(`${API_BASE}/update/${userId}`, {
            method: "PUT",
            credentials: 'include',
            body: formData
        });

        if(res.ok) {
            alert("Profile updated successfully");
            loadUser();
            // Close modal
            const modal = bootstrap.Modal.getInstance(document.getElementById('editProfileModal'));
            modal.hide();
        } else {
            const text = await res.text();
            alert("Error: " + text);
        }
    });

    async function loadUserPosts() {
        const res = await fetch(POSTS_API, { credentials: 'include' });
        if (!res.ok) return;
        const posts = await res.json();
        const postsDiv = document.getElementById('userPosts');
        postsDiv.innerHTML = '';
        if (posts.length === 0) {
            postsDiv.innerHTML = '<p class="text-center">No posts found.</p>';
            return;
        }
        posts.forEach(post => {
            const postEl = document.createElement('div');
            postEl.className = 'post-card';
            postEl.innerHTML = `
                <div class="post-title">${post.title}</div>
                <div class="post-content">${post.content}</div>
            `;
            postsDiv.appendChild(postEl);
        });
    }

    window.onload = function() {
        loadUser();
        loadUserPosts();
    };
</script>
</body>
</html>
