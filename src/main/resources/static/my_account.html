<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Account - BlogSphere</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="/front_end/images/download.png.png" type="image/x-icon">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .account-wrapper {
            max-width: 500px;
            margin: 40px auto;
            background: rgba(255,255,255,0.07);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            padding: 2.5rem 2rem;
        }
        .profile-img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #fd6537;
            background: #fff;
        }
        .blogsphere-icon {
            width: 48px;
            margin-bottom: 10px;
        }
        .user-info h5 {
            margin-top: 10px;
            font-size: 1.4rem;
            font-weight: 600;
        }
        .user-info p {
            margin-bottom: 0.5rem;
            color: #d3cfc6;
        }
        .edit-section {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #fd6537;
        }
        .form-label {
            color: #fff;
            font-weight: 500;
        }
        .btn-save {
            background: #fd6537;
            color: #fff;
            font-weight: 500;
            border-radius: 8px;
            padding: 12px 24px;
            margin-top: 10px;
        }
        .btn-save:hover {
            background: #ff835e;
        }
        @media (max-width: 600px) {
            .account-wrapper {
                max-width: 98vw;
                padding: 1.2rem 0.5rem;
            }
            .profile-img {
                width: 80px;
                height: 80px;
            }
            .blogsphere-icon {
                width: 36px;
            }
        }
    </style>
</head>
<body>
<div class="account-wrapper">
    <div class="text-center">
        <img src="/front_end/images/download.png.png" class="blogsphere-icon" alt="BlogSphere Icon">
        <h1 style="font-size:2rem; font-weight:700; margin-bottom:1.2rem;">My Account</h1>
    </div>
    <div id="userInfo" class="user-info text-center mb-4">
        <img id="profileImage" class="profile-img mb-2" src="/uploads/default.png" alt="Profile">
        <h5 id="userName">User Name</h5>
        <p id="userEmail">user@email.com</p>
        <p id="userBio"></p>
    </div>
    <div class="edit-section">
        <h4 class="mb-3 text-center" style="color:#fd6537;">Edit Profile</h4>
        <form id="editForm" enctype="multipart/form-data">
            <input type="hidden" id="userId">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Bio</label>
                <textarea id="bio" class="form-control" rows="2"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Profile Image</label>
                <input type="file" id="profileImageInput" class="form-control" accept="image/*">
            </div>
            <button type="submit" class="btn btn-save w-100">Save Changes</button>
        </form>
    </div>
</div>
<script>
    const API_BASE = "http://localhost:8080/api/users";

    async function loadUser() {
        const res = await fetch(`${API_BASE}/me`, { credentials: 'include' });
        if (!res.ok) return;
        const user = await res.json();

        document.getElementById('userId').value = user.id;
        document.getElementById('name').value = user.name;
        document.getElementById('email').value = user.email;
        document.getElementById('bio').value = user.bio || '';

        document.getElementById('userName').textContent = user.name;
        document.getElementById('userEmail').textContent = user.email;
        document.getElementById('userBio').textContent = user.bio || '';
        document.getElementById('profileImage').src = user.profileImagePath
            ? `/uploads/${user.profileImagePath}`
            : `/uploads/default.png`;
    }

    document.getElementById('editForm').addEventListener('submit', async function(e){
        e.preventDefault();
        const userId = document.getElementById('userId').value;
        const formData = new FormData();
        formData.append("name", document.getElementById('name').value);
        formData.append("email", document.getElementById('email').value);
        formData.append("bio", document.getElementById('bio').value);
        const imageFile = document.getElementById('profileImageInput').files[0];
        if(imageFile) formData.append("profileImage", imageFile);

        const res = await fetch(`${API_BASE}/update/${userId}`, {
            method: "PUT",
            credentials: 'include',
            body: formData
        });

        if(res.ok) {
            alert("Profile updated successfully");
            loadUser();
        } else {
            const text = await res.text();
            alert("Error: " + text);
        }
    });

    window.onload = loadUser;
</script>
</body>
</html>
