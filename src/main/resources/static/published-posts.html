<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Published Posts - BlogSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="/front_end/images/download.png.png" type="image/x-icon">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            color: #f6f2e9;
            font-family: Arial, Helvetica, sans-serif;
        }
        .navbar-glass {
            background: rgba(34,34,34,0.85);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.25);
            margin: 18px auto 32px auto;
            padding: 0.7rem 1.5rem;
        }
        .glassy-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .post-image {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
        }
        .glassy-btn {
            background: #fd6537;
            border: none;
            color: #fff;
            border-radius: 8px;
            padding: 8px 18px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .glassy-btn:hover {
            background: #ff835e;
        }
        .post-title a {
            color: inherit;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .post-title a:hover {
            color: #fd6537;
        }
        .like-btn, .comment-toggle-btn {
            background: transparent;
            color: #fd6537;
            border: 1px solid #fd6537;
            border-radius: 50px;
            padding: 6px 15px;
            transition: background-color 0.2s, color 0.2s;
        }
        .like-btn:hover, .comment-toggle-btn:hover {
            background: #fd6537;
            color: #fff;
        }
        .like-btn.liked {
            background: #fd6537;
            color: #fff;
        }
        .comment-section {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1rem;
        }
        .comment-item {
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .read-more-btn {
            margin-top: 10px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-glass fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/index.html">
            <img src="/front_end/images/download.png.png" alt="Logo" width="40" height="40" class="me-2">
            BlogSphere
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a href="/post.html" class="nav-link">Create New Post</a></li>
                <li class="nav-item"><a href="/my_account.html" class="nav-link">My Account</a></li>
                <li class="nav-item">
                    <form action="/logout" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-logout">
                            <i class="fa-solid fa-right-from-bracket"></i> Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
<main class="container py-5" style="margin-top: 80px;">
    <h2 class="text-center mb-5">All Published Posts</h2>
    <div id="post-list" class="row g-4">
        <!-- Posts will be dynamically loaded here -->
    </div>
</main>
<!-- Post Modal -->
<div class="modal fade" id="postModal" tabindex="-1" aria-labelledby="postModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content glassy-card text-white">
            <div class="modal-header border-0">
                <h5 class="modal-title" id="postModalLabel"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalContent">
                <!-- Full post content will be loaded here -->
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const BASE_URL = 'http://localhost:8080/api/posts';
    let loadedPosts = [];

    async function loadPublishedPosts() {
        try {
            const response = await fetch(`${BASE_URL}/published`, { credentials: 'include' });
            const result = await response.json();
            loadedPosts = result.data;
            renderPosts();
        } catch (error) {
            document.getElementById('post-list').innerHTML = `<div class="col-12"><div class="alert alert-danger">Failed to load posts.</div></div>`;
        }
    }

    function renderPosts() {
        const postList = document.getElementById('post-list');
        if (!loadedPosts || loadedPosts.length === 0) {
            postList.innerHTML = `<div class="col-12"><div class="alert alert-info">No published posts found.</div></div>`;
            return;
        }
        postList.innerHTML = loadedPosts.map(post => `
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="card glassy-card h-100 text-white-50">
                    ${post.imagePath ? `<img src="/uploads/${post.imagePath}" class="post-image mt-3 mb-2" alt="Post Image">` : ''}
                    <div class="card-body">
                        <h5 class="card-title post-title" style="color:#fd6537;">${post.title}</h5>
                        <p class="card-text"><small>By ${post.author} | ${new Date(post.createdDate).toLocaleDateString()}</small></p>
                        <p class="card-text">${post.content.length > 120 ? post.content.substring(0,120) + '...' : post.content}</p>
                        <button class="btn glassy-btn mt-2 read-more-btn" data-post-id="${post.id}">Read More</button>
                        <div class="mt-3 d-flex align-items-center gap-2">
                            <button class="like-btn" data-post-id="${post.id}">
                                <i class="fa-regular fa-thumbs-up"></i>
                                <span class="like-count">${post.likes}</span>
                            </button>
                            <button class="comment-toggle-btn" type="button" data-bs-toggle="collapse" data-bs-target="#comments-${post.id}" aria-expanded="false" aria-controls="comments-${post.id}">
                                <i class="fa-regular fa-comment"></i>
                                <span class="comment-count">${post.commentsCount}</span>
                            </button>
                        </div>
                        <div class="collapse comment-section" id="comments-${post.id}">
                            <div id="comments-list-${post.id}" class="mb-2"></div>
                            <form class="comment-form" data-post-id="${post.id}">
                                <div class="input-group">
                                    <textarea class="form-control" rows="1" placeholder="Add a comment"></textarea>
                                    <button class="btn glassy-btn" type="submit">Post</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
        initializeLikeStatus();
    }

    async function initializeLikeStatus() {
        for (const post of loadedPosts) {
            const likeBtn = document.querySelector(`.like-btn[data-post-id="${post.id}"]`);
            if (likeBtn) {
                try {
                    const res = await fetch(`${BASE_URL}/${post.id}/user-like-status`, { credentials: 'include' });
                    const result = await res.json();
                    if (result.data) {
                        likeBtn.classList.add('liked');
                        likeBtn.querySelector('i').classList.remove('fa-regular');
                        likeBtn.querySelector('i').classList.add('fa-solid');
                    } else {
                        likeBtn.classList.remove('liked');
                        likeBtn.querySelector('i').classList.remove('fa-solid');
                        likeBtn.querySelector('i').classList.add('fa-regular');
                    }
                } catch {}
            }
        }
    }

    document.addEventListener('DOMContentLoaded', loadPublishedPosts);

    // Like button functionality
    document.getElementById('post-list').addEventListener('click', async (e) => {
        if (e.target.closest('.like-btn')) {
            const likeBtn = e.target.closest('.like-btn');
            const postId = likeBtn.getAttribute('data-post-id');
            const likeCountSpan = likeBtn.querySelector('.like-count');
            const likeIcon = likeBtn.querySelector('i');
            try {
                const res = await fetch(`${BASE_URL}/${postId}/like`, { method: 'POST', credentials: 'include' });
                const result = await res.json();
                // Update like count and button state
                const post = loadedPosts.find(p => p.id == postId);
                if (post) {
                    if (likeBtn.classList.contains('liked')) {
                        post.likes = Math.max(0, post.likes - 1);
                        likeBtn.classList.remove('liked');
                        likeIcon.classList.remove('fa-solid');
                        likeIcon.classList.add('fa-regular');
                    } else {
                        post.likes += 1;
                        likeBtn.classList.add('liked');
                        likeIcon.classList.remove('fa-regular');
                        likeIcon.classList.add('fa-solid');
                    }
                    likeCountSpan.textContent = post.likes;
                }
            } catch (error) {
                alert('Failed to toggle like');
            }
        }
        // Read More button functionality
        if (e.target.classList.contains('read-more-btn')) {
            const postId = e.target.getAttribute('data-post-id');
            const post = loadedPosts.find(p => p.id == postId);
            if (!post) return;
            document.getElementById('postModalLabel').textContent = post.title;
            document.getElementById('modalContent').innerHTML = `
                ${post.imagePath ? `<img src="/uploads/${post.imagePath}" class="post-image mb-3">` : ''}
                <p>${post.content}</p>
                <div class="mt-2" style="color:#fd6537;">
                    👍 ${post.likes} &nbsp; 💬 ${post.commentsCount} &nbsp; 👁️ ${post.views}
                </div>
            `;
            const modal = new bootstrap.Modal(document.getElementById('postModal'));
            modal.show();
        }
    });

    // Comment form submit
    document.getElementById('post-list').addEventListener('submit', async (e) => {
        if (e.target.classList.contains('comment-form')) {
            e.preventDefault();
            const form = e.target;
            const postId = form.getAttribute('data-post-id');
            const commentTextarea = form.querySelector('textarea');
            const content = commentTextarea.value;
            const commentsListDiv = document.getElementById(`comments-list-${postId}`);
            const commentCountSpan = document.querySelector(`.comment-toggle-btn[data-bs-target="#comments-${postId}"] .comment-count`);
            if (!content.trim()) return;
            try {
                const res = await fetch(`${BASE_URL}/${postId}/comments`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(content)
                });
                const result = await res.json();
                commentTextarea.value = '';
                // Reload comments
                loadComments(postId);
                // Update comment count
                const post = loadedPosts.find(p => p.id == postId);
                if (post) {
                    post.commentsCount += 1;
                    commentCountSpan.textContent = post.commentsCount;
                }
            } catch (error) {
                alert('Failed to add comment');
            }
        }
    });

    // Load comments when comment section is opened
    document.getElementById('post-list').addEventListener('show.bs.collapse', async (e) => {
        const collapseElement = e.target;
        const postId = collapseElement.id.replace('comments-', '');
        loadComments(postId);
    });

    async function loadComments(postId) {
        const commentsListDiv = document.getElementById(`comments-list-${postId}`);
        commentsListDiv.innerHTML = '<div class="text-center text-muted">Loading comments...</div>';
        try {
            const response = await fetch(`${BASE_URL}/${postId}/comments`);
            const result = await response.json();
            if (response.ok && Array.isArray(result.data)) {
                commentsListDiv.innerHTML = result.data.map(comment => `
                    <div class="comment-item">
                        <small class="text-white fw-bold">${comment.authorName}</small>
                        <p class="mb-0 text-white-50">${comment.content}</p>
                        <small class="text-muted">${new Date(comment.createdDate).toLocaleDateString()}</small>
                    </div>
                `).join('');
            } else {
                commentsListDiv.innerHTML = '<div class="text-center text-muted">No comments found or failed to load.</div>';
            }
        } catch {
            commentsListDiv.innerHTML = '<div class="text-center text-muted">Failed to load comments.</div>';
        }
    }
</script>
</body>
</html>
