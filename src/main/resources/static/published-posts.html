<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Published Posts - BlogSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="/front_end/images/download.png.png" type="image/x-icon">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            color: #f6f2e9;
            font-family: Arial, Helvetica, sans-serif;
        }
        .navbar-glass {
            background: rgba(34,34,34,0.85);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.25);
            margin: 18px auto 32px auto;
            padding: 0.7rem 1.5rem;
            max-width: 1100px;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.3rem;
            color: #fd6537 !important;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar-brand img {
            width: 38px;
        }
        .nav-link, .btn-nav {
            color: #fff !important;
            font-weight: 500;
            margin-right: 10px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .btn-nav {
            background: #fd6537;
            border: none;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .btn-nav:hover, .nav-link:hover {
            background: #ff835e;
            color: #fff !important;
        }
        .btn-logout {
            background: #333;
            color: #fd6537 !important;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .btn-logout:hover {
            background: #fd6537;
            color: #fff !important;
        }
        .glassy-card {
            background: rgba(255,255,255,0.13);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.18);
            padding: 2rem 1.5rem;
            margin-bottom: 2rem;
            color: #fff;
        }
        .post-image {
            max-width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
            margin-bottom: 1rem;
        }
        .engagement {
            font-size: 0.95em;
            color: #fd6537;
        }
        .read-more-btn {
            background: #fd6537;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .read-more-btn:hover {
            background: #ff835e;
        }
        @media (max-width: 600px) {
            .navbar-glass {
                padding: 0.5rem 0.5rem;
                max-width: 98vw;
            }
            .navbar-brand img {
                width: 28px;
            }
            .btn-nav, .btn-logout {
                padding: 6px 10px;
                font-size: 0.95rem;
            }
            .glassy-card {
                padding: 1rem 0.5rem;
            }
            .post-image {
                max-height: 120px;
            }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-glass">
    <div class="container-fluid">
        <a class="navbar-brand" href="/index.html">
            <img src="/front_end/images/download.png.png" alt="BlogSphere Icon">
            BlogSphere
        </a>
        <div class="d-flex">
            <a href="/post.html" class="btn btn-nav">
                <i class="fa-solid fa-plus"></i> Create New Post
            </a>
            <a href="/published-posts.html" class="btn btn-nav">
                <i class="fa-solid fa-list"></i> All Posts
            </a>
            <form action="/logout" method="post" style="display:inline;">
                <button type="submit" class="btn btn-logout">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </form>
        </div>
    </div>
</nav>
<div class="container py-4">
    <h1 class="mb-4 text-center" style="color:#fd6537; font-weight:700;">Published Posts</h1>
    <div id="posts" class="row"></div>
</div>

<!-- Post Modal -->
<div class="modal fade" id="postModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content" style="background: rgba(34,34,34,0.95); color: #fff; border-radius: 16px;">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" style="background: #fff;"></button>
      </div>
      <div class="modal-body" id="modalContent"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let loadedPosts = [];

    async function loadPublishedPosts() {
        const response = await fetch("http://localhost:8080/api/posts/published");
        const data = await response.json();
        loadedPosts = data.data;
        const postsDiv = document.getElementById("posts");
        postsDiv.innerHTML = loadedPosts.length === 0
            ? `<div class="col-12 text-center text-light">No published posts yet.</div>`
            : loadedPosts.map((post, idx) => `
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="glassy-card h-100 d-flex flex-column">
                        ${post.imagePath ? `<img src="/uploads/${post.imagePath}" alt="Post Image" class="post-image">` : ''}
                        <span class="bg-dark text-warning px-3 py-1 rounded-full text-sm mb-2 align-self-start">${post.status}</span>
                        <h5 class="mt-2 mb-2" style="color:#fd6537;">${post.title}</h5>
                        <p class="mb-3 flex-grow-1">${post.content.length > 120 ? post.content.substring(0, 120) + '...' : post.content}</p>
                        <div class="engagement mb-2">
                            👍 ${post.likes} &nbsp; 💬 ${post.commentsCount} &nbsp; 👁️ ${post.views}
                        </div>
                        <button class="read-more-btn mt-auto" data-idx="${idx}">Read More</button>
                    </div>
                </div>
            `).join('');

        document.querySelectorAll('.read-more-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const idx = this.getAttribute('data-idx');
                showPostModal(loadedPosts[idx]);
            });
        });
    }

    function showPostModal(post) {
        document.getElementById('modalTitle').textContent = post.title;
        document.getElementById('modalContent').innerHTML = `
            ${post.imagePath ? `<img src="/uploads/${post.imagePath}" alt="Post Image" class="post-image mb-3">` : ''}
            <span class="bg-dark text-warning px-3 py-1 rounded-full text-sm mb-2 d-inline-block">${post.status}</span>
            <div class="mb-2">
                <span>${post.author}</span>
                <span class="mx-2">•</span>
                <span>${new Date(post.createdDate).toLocaleDateString()}</span>
            </div>
            <p>${post.content}</p>
            <div class="engagement mt-3">
                👍 ${post.likes} &nbsp; 💬 ${post.commentsCount} &nbsp; 👁️ ${post.views}
            </div>
        `;
        const modal = new bootstrap.Modal(document.getElementById('postModal'));
        modal.show();
        fetch(`http://localhost:8080/api/posts/${post.id}/view`, { method: 'POST', credentials: 'include' });
    }

    document.addEventListener('DOMContentLoaded', loadPublishedPosts);
</script>
</body>
</html>
