<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Published Posts - BlogSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
    <link rel="icon" href="/front_end/images/download.png.png" type="image/x-icon"/>
    <style>
        body {
            background: linear-gradient(135deg,#1a1a1a 0%,#2d2d2d 100%);
            min-height:100vh;
            color:#f6f2e9;
            font-family:Arial,Helvetica,sans-serif;
        }
        .navbar-glass{background:rgba(34,34,34,0.85);backdrop-filter:blur(8px);border-radius:16px;
            box-shadow:0 4px 24px rgba(0,0,0,0.25);margin:18px auto 32px auto;padding:0.7rem 1.5rem;}
        .glassy-card{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border-radius:16px;
            border:1px solid rgba(255,255,255,0.1);box-shadow:0 4px 30px rgba(0,0,0,0.1);}
        .post-image{max-width:100%;height:auto;border-radius:12px;}
        .glassy-btn{background:#fd6537;border:none;color:#fff;border-radius:8px;padding:8px 18px;
            font-weight:600;transition:background 0.2s;}
        .glassy-btn:hover{background:#ff835e;}
        .post-title a{color:inherit;text-decoration:none;transition:color 0.3s ease;}
        .post-title a:hover{color:#fd6537;}
        .like-btn,.comment-toggle-btn{background:transparent;color:#fd6537;border:1px solid #fd6537;
            border-radius:50px;padding:6px 15px;transition:background-color 0.2s,color 0.2s;}
        .like-btn:hover,.comment-toggle-btn:hover{background:#fd6537;color:#fff;}
        .like-btn.liked{background:#fd6537;color:#fff;}
        .comment-section{background:rgba(255,255,255,0.03);border-radius:10px;padding:1rem;margin-top:1rem;}
        .comment-item{background:rgba(255,255,255,0.05);border-radius:6px;padding:0.5rem;margin-bottom:0.5rem;}
        .read-more-btn{margin-top:10px;}
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-glass fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/index.html">
            <img src="/front_end/images/download.png.png" alt="Logo" width="40" height="40" class="me-2"/>
            BlogSphere
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a href="/post.html" class="nav-link">Create New Post</a></li>
                <li class="nav-item"><a href="/my_account.html" class="nav-link">My Account</a></li>
                <li class="nav-item">
                    <form action="/logout" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-logout">
                            <i class="fa-solid fa-right-from-bracket"></i> Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5" style="margin-top:80px;">
    <h2 class="text-center mb-5">All Published Posts</h2>

    <!-- Search -->
    <div class="d-flex justify-content-between mb-4">
        <input type="text" id="searchBar" class="form-control w-50" placeholder="Search posts by title"/>
    </div>

    <!-- Posts -->
    <div id="post-list" class="row g-4"></div>

    <!-- Pagination -->
    <nav>
        <ul class="pagination justify-content-center" id="pagination"></ul>
    </nav>
</main>

<!-- Post Modal -->
<div class="modal fade" id="postModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content glassy-card text-white">
            <div class="modal-header border-0">
                <h5 class="modal-title" id="postModalLabel"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalContent"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const BASE_URL = 'http://localhost:8080/api/posts';
    let loadedPosts = [];
    let currentPage = 0;
    const pageSize = 6;

    // Load posts
    async function loadPublishedPosts(query="", page=0, size=pageSize){
        try{
            const res = await fetch(`${BASE_URL}/search?title=${query}&page=${page}&size=${size}`, {credentials:"include"});
            const result = await res.json();
            loadedPosts = result.data.content;
            renderPosts();
            renderPagination(result.data.totalPages, page);
        }catch(err){
            document.getElementById('post-list').innerHTML =
                `<div class="col-12"><div class="alert alert-danger">Failed to load posts.</div></div>`;
        }
    }

    // Render posts
    function renderPosts(){
        const postList = document.getElementById('post-list');
        if(!loadedPosts || loadedPosts.length===0){
            postList.innerHTML = `<div class="col-12"><div class="alert alert-info">No published posts found.</div></div>`;
            return;
        }
        postList.innerHTML = loadedPosts.map(post=>`
    <div class="col-lg-4 col-md-6 mb-4">
      <div class="card glassy-card h-100 text-white-50">
        ${post.imagePath ? `<img src="/uploads/${post.imagePath}" class="post-image mt-3 mb-2"/>` : ''}
        <div class="card-body">
          <h5 class="card-title post-title" style="color:#fd6537;">${post.title}</h5>
          <p class="card-text"><small>By ${post.author} | ${new Date(post.createdDate).toLocaleDateString()}</small></p>
          <p class="card-text">${post.content.length>120?post.content.substring(0,120)+'...':post.content}</p>
          <button class="btn glassy-btn mt-2 read-more-btn" data-post-id="${post.id}">Read More</button>
          <div class="mt-3 d-flex align-items-center gap-2">
            <button class="like-btn" data-post-id="${post.id}">
              <i class="fa-regular fa-thumbs-up"></i>
              <span class="like-count">${post.likes}</span>
            </button>
            <button class="comment-toggle-btn" type="button" data-bs-toggle="collapse"
              data-bs-target="#comments-${post.id}">
              <i class="fa-regular fa-comment"></i>
              <span class="comment-count">${post.commentsCount}</span>
            </button>
          </div>
          <div class="collapse comment-section" id="comments-${post.id}">
            <div id="comments-list-${post.id}" class="mb-2"></div>
            <form class="comment-form" data-post-id="${post.id}">
              <div class="input-group">
                <textarea class="form-control" rows="1" placeholder="Add a comment"></textarea>
                <button class="btn glassy-btn" type="submit">Post</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>`).join('');
        initializeLikeStatus();
    }

    // Pagination render
    function renderPagination(totalPages, current){
        const pagination = document.getElementById('pagination');
        pagination.innerHTML='';
        for(let i=0;i<totalPages;i++){
            pagination.innerHTML += `
      <li class="page-item ${i===current?'active':''}">
        <button class="page-link" onclick="loadPublishedPosts(document.getElementById('searchBar').value,${i})">${i+1}</button>
      </li>`;
        }
    }

    // Like status check
    async function initializeLikeStatus(){
        for(const post of loadedPosts){
            const likeBtn = document.querySelector(`.like-btn[data-post-id="${post.id}"]`);
            if(likeBtn){
                try{
                    const res = await fetch(`${BASE_URL}/${post.id}/user-like-status`, {credentials:'include'});
                    const result = await res.json();
                    if(result.data){
                        likeBtn.classList.add('liked');
                        likeBtn.querySelector('i').classList.replace('fa-regular','fa-solid');
                    }
                }catch{}
            }
        }
    }

    // Events
    document.addEventListener('DOMContentLoaded', ()=>loadPublishedPosts());
    document.getElementById('searchBar').addEventListener('input', e=>{
        loadPublishedPosts(e.target.value,0);
    });
    document.getElementById('post-list').addEventListener('click', async e=>{
        // Like
        if(e.target.closest('.like-btn')){
            const btn=e.target.closest('.like-btn');
            const postId=btn.getAttribute('data-post-id');
            const icon=btn.querySelector('i');
            const span=btn.querySelector('.like-count');
            try{
                await fetch(`${BASE_URL}/${postId}/like`,{method:'POST',credentials:'include'});
                const post=loadedPosts.find(p=>p.id==postId);
                if(btn.classList.contains('liked')){
                    post.likes=Math.max(0,post.likes-1);
                    btn.classList.remove('liked');
                    icon.classList.replace('fa-solid','fa-regular');
                }else{
                    post.likes++;
                    btn.classList.add('liked');
                    icon.classList.replace('fa-regular','fa-solid');
                }
                span.textContent=post.likes;
            }catch{alert('Failed to toggle like')}
        }
        // Read more
        if(e.target.classList.contains('read-more-btn')){
            const id=e.target.dataset.postId;
            const post=loadedPosts.find(p=>p.id==id);
            if(!post)return;
            document.getElementById('postModalLabel').textContent=post.title;
            document.getElementById('modalContent').innerHTML=`
      ${post.imagePath?`<img src="/uploads/${post.imagePath}" class="post-image mb-3"/>`:''}
      <p>${post.content}</p>
      <div class="mt-2" style="color:#fd6537;">
        👍 ${post.likes} &nbsp; 💬 ${post.commentsCount} &nbsp; 👁️ ${post.views}
      </div>`;
            new bootstrap.Modal(document.getElementById('postModal')).show();
        }
    });
    // Comment
    document.getElementById('post-list').addEventListener('submit', async e=>{
        if(e.target.classList.contains('comment-form')){
            e.preventDefault();
            const form=e.target;
            const id=form.dataset.postId;
            const txt=form.querySelector('textarea');
            if(!txt.value.trim())return;
            try{
                await fetch(`${BASE_URL}/${id}/comments`,{
                    method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify(txt.value)});
                txt.value='';
                loadComments(id);
                const post=loadedPosts.find(p=>p.id==id);
                if(post){post.commentsCount++;form.closest('.card-body').querySelector('.comment-count').textContent=post.commentsCount;}
            }catch{alert('Failed to add comment')}
        }
    });
    document.getElementById('post-list').addEventListener('show.bs.collapse', e=>{
        const id=e.target.id.replace('comments-','');
        loadComments(id);
    });
    async function loadComments(id){
        const div=document.getElementById(`comments-list-${id}`);
        div.innerHTML='<div class="text-center text-muted">Loading comments...</div>';
        try{
            const res=await fetch(`${BASE_URL}/${id}/comments`);
            const result=await res.json();
            div.innerHTML=(Array.isArray(result.data)&&result.data.length)?result.data.map(c=>`
      <div class="comment-item">
        <small class="text-white fw-bold">${c.authorName}</small>
        <p class="mb-0 text-white-50">${c.content}</p>
        <small class="text-muted">${new Date(c.createdDate).toLocaleDateString()}</small>
      </div>`).join(''):'<div class="text-center text-muted">No comments.</div>';
        }catch{div.innerHTML='<div class="text-center text-muted">Failed to load comments.</div>';}
    }
</script>
</body>
</html>
