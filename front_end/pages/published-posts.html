<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechBlog - Latest Insights in Web Development</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-blue-600">TechBlog</h1>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="#" class="text-gray-700 hover:text-blue-600">Home</a>
                    <a href="#" class="text-gray-700 hover:text-blue-600">Blog</a>
                    <a href="#" class="text-gray-700 hover:text-blue-600">About</a>
                    <a href="#" class="text-gray-700 hover:text-blue-600">Admin</a>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="text-gray-500">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </button>
                    <button class="bg-gray-900 text-white px-4 py-2 rounded-md text-sm">
                        Subscribe
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="gradient-bg text-white py-20">
        <div class="max-w-4xl mx-auto text-center px-4">
            <h1 class="text-4xl md:text-5xl font-bold mb-6">Welcome to TechBlog</h1>
            <p class="text-xl mb-8 opacity-90">
                Discover the latest insights, tutorials, and trends in web development, AI, and technology.
            </p>
            <button class="bg-white text-purple-600 px-8 py-3 rounded-md font-semibold hover:bg-gray-100 transition-colors">
                Latest Articles
            </button>
        </div>
    </section>

    <!-- Latest Articles (Dynamic) -->
    <section class="py-16 bg-gray-50">
        <div class="max-w-6xl mx-auto px-4">
            <h2 class="text-3xl font-bold text-center mb-12">Latest Articles</h2>
            <div id="posts" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Dynamic posts will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Newsletter Section -->
    <section class="bg-gray-900 text-white py-16">
        <div class="max-w-4xl mx-auto text-center px-4">
            <h2 class="text-3xl font-bold mb-4">Stay Updated</h2>
            <p class="text-gray-300 mb-8">
                Subscribe to our newsletter and never miss the latest articles and updates.
            </p>
            <div class="flex flex-col sm:flex-row gap-4 max-w-md mx-auto">
                <input
                    type="email"
                    placeholder="Enter your email"
                    class="flex-1 px-4 py-3 rounded-md text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                <button class="bg-blue-600 text-white px-8 py-3 rounded-md font-semibold hover:bg-blue-700 transition-colors">
                    Subscribe
                </button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-white py-8 border-t">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-gray-600">&copy; 2024 TechBlog. All rights reserved.</p>
        </div>
    </footer>
    <script>
        async function loadPublishedPosts() {
            const response = await fetch("http://localhost:8080/api/posts/published");
            const data = await response.json();
            const posts = data.data;
            const postsDiv = document.getElementById("posts");
            postsDiv.innerHTML = posts.length === 0
                ? `<div class="col-span-3 text-center text-gray-500">No published posts yet.</div>`
                : posts.map(post => `
                    <article class="bg-white rounded-lg shadow-sm overflow-hidden flex flex-col">
                        <div class="bg-gray-200 h-48 flex items-center justify-center">
                            ${post.imagePath ? `<img src="/uploads/${post.imagePath}" alt="Post Image" class="object-cover h-full w-full">` : `<span class="text-gray-500">No Image</span>`}
                        </div>
                        <div class="p-6 flex-1 flex flex-col">
                            <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm mb-2">${post.status}</span>
                            <h3 class="text-xl font-bold mt-2 mb-3">${post.title}</h3>
                            <p class="text-gray-600 text-sm mb-4 flex-1">${post.content.length > 120 ? post.content.substring(0, 120) + '...' : post.content}</p>
                            <div class="flex items-center text-sm text-gray-500 mb-2">
                                <span>${post.author}</span>
                                <span class="mx-2">•</span>
                                <span>${new Date(post.createdDate).toLocaleDateString()}</span>
                            </div>
                            <button class="text-blue-600 font-semibold hover:text-blue-800 mt-auto">Read More</button>
                        </div>
                    </article>
                `).join('');
        }
        document.addEventListener("DOMContentLoaded", loadPublishedPosts);
    </script>
</body>
</html>
