<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Posts - BlogSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
    <link rel="icon" href="../images/download.png" type="image/x-icon" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            color: #f6f2e9;
            font-family: "Source Sans Pro", Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Navbar */
        .navbar-glass {
            background: rgba(34, 34, 34, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            margin: 18px auto 32px auto;
            padding: 0.7rem 1.5rem;
            max-width: 1150px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 140, 0, 0.2);
            animation: fadeInDown 0.8s ease-out;

        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.4rem;
            color: #fd6537 !important;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar-brand img { width: 38px; }

        /* Buttons */
        .btn-nav {
            background: linear-gradient(135deg, #fd6537, #ff835e);
            border: none;
            padding: 9px 18px;
            border-radius: 10px;
            font-weight: 600;
            color: #fff !important;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(253, 101, 55, 0.3);
        }
        .btn-nav:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(253, 101, 55, 0.5);
        }

        /* Card (Glassy look) */
        .glassy-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 140, 0, 0.2);
            padding: 2rem 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease;
            transition: all 0.3s ease;
        }
        .glassy-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.45);
            border-color: rgba(253, 101, 55, 0.4);
        }

        /* Form */
        .form-label { color: #fd6537; font-weight: 600; }
        .form-control {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(253, 101, 55, 0.4);
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #fd6537;
            box-shadow: 0 0 0 0.2rem rgba(253, 101, 55, 0.25);
            color: #fff;
        }
        .glassy-btn {
            background: linear-gradient(135deg, #fd6537, #ff835e);
            border: none;
            border-radius: 10px;
            padding: 10px 22px;
            font-weight: 600;
            color: #fff;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(253, 101, 55, 0.3);
        }
        .glassy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 28px rgba(253, 101, 55, 0.5);
        }

        /* Posts */
        .post-image {
            max-width: 600px;
            max-height: 400px;
            object-fit: cover;
            border-radius: 14px;
            margin-top: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        .post-image:hover { transform: scale(1.02); }

        /* Modal */
        .modal-content {
            background: rgba(34, 34, 34, 0.95);
            color: #fff;
            border-radius: 18px;
            border: 1px solid #fd6537;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            animation: fadeInScale 0.5s ease;
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        @media (max-width: 600px) {
            .navbar-brand img { width: 28px; }
            .btn-nav, .btn-logout { padding: 6px 12px; font-size: 0.9em; }
            .glassy-card { padding: 1rem; }
            .post-image { max-width: 100%; max-height: 250px; }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-glass fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
            <img src="../images/download.png" alt="BlogSphere Icon"/>
            BlogSphere
        </a>
        <div class="d-flex">
            <a href="published-posts.html" class="btn btn-nav">
                <i class="fa-solid fa-list"></i> Published Posts
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h1 class="mb-4 text-center" style="color:#fd6537;">Create Posts</h1>

    <!-- Create Post -->
    <div class="glassy-card">
        <h5 class="mb-3" style="color:#fd6537;">Create New Post</h5>
        <form id="postForm" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label for="content" class="form-label">Content</label>
                <textarea id="content" class="form-control" rows="4" required></textarea>
            </div>
            <div class="mb-3">
                <label for="image" class="form-label">Image (optional)</label>
                <input type="file" id="image" class="form-control" accept="image/*"/>
            </div>
            <button type="submit" class="glassy-btn">Submit Post</button>
        </form>
        <div id="postError" class="text-danger mt-2" style="display:none"></div>
        <div id="postSuccess" class="text-success mt-2" style="display:none"></div>
    </div>

    <!-- User Posts -->
    <div id="postsList"></div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <form id="editForm" class="modal-content" enctype="multipart/form-data">
            <div class="modal-header">
                <h5 class="modal-title" id="editModalLabel">Edit Post</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editPostId">
                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" id="editTitle" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Content</label>
                    <textarea id="editContent" class="form-control" rows="4" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Image (optional)</label>
                    <input type="file" id="editImage" class="form-control" accept="image/*"/>
                </div>
                <div id="editError" class="text-danger mt-2" style="display:none"></div>
                <div id="editSuccess" class="text-success mt-2" style="display:none"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-warning">Update Post</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const BASE_URL = 'http://localhost:8080/api/posts';
    let editModal = new bootstrap.Modal(document.getElementById('editModal'));

    async function loadMyPosts() {
        try {
            const res = await fetch(`${BASE_URL}/me/posts`, { credentials: 'include' });
            if(!res.ok) throw new Error('Failed to fetch posts');
            const result = await res.json();
            const posts = result.data || [];
            const postsList = document.getElementById('postsList');

            if(posts.length === 0) {
                postsList.innerHTML = `<div class="alert alert-info">You have not created any posts yet.</div>`;
                return;
            }

            // Render posts
            postsList.innerHTML = posts.map(post => `
            <div class="glassy-card"
                 data-id="${post.id}"
                 data-title="${post.title.replace(/"/g,'&quot;')}"
                 data-content="${post.content.replace(/"/g,'&quot;')}">
                <h5 style="color:#fd6537;">${post.title}</h5>
                <p><small>${new Date(post.createdDate).toLocaleString()}</small></p>
                ${post.imagePath ? `<img src="/uploads/${post.imagePath}" class="post-image">` : ''}
                <p>${post.content}</p>
                <button class="btn btn-sm btn-warning me-2 update-btn">Update</button>
                <button class="btn btn-sm btn-danger delete-btn">Delete</button>
            </div>
        `).join('');

            // Add event listeners
            document.querySelectorAll('.update-btn').forEach(btn => {
                btn.addEventListener('click', e => {
                    const card = e.target.closest('.glassy-card');
                    openEditModal(card.dataset.id, card.dataset.title, card.dataset.content);
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', e => {
                    const card = e.target.closest('.glassy-card');
                    deletePost(card.dataset.id);
                });
            });

        } catch(err) {
            console.error(err);
            document.getElementById('postsList').innerHTML = `<div class="alert alert-danger">Failed to load your posts</div>`;
        }
    }

    function openEditModal(id, title, content){
        document.getElementById('editPostId').value = id;
        document.getElementById('editTitle').value = title;
        document.getElementById('editContent').value = content;
        document.getElementById('editError').style.display='none';
        document.getElementById('editSuccess').style.display='none';
        editModal.show();
    }

    // The rest of your submit/delete handlers remain the same
    document.getElementById('editForm').addEventListener('submit', async e => {
        e.preventDefault();
        const id = document.getElementById('editPostId').value;
        const title = document.getElementById('editTitle').value.trim();
        const content = document.getElementById('editContent').value.trim();
        const image = document.getElementById('editImage').files[0];
        const formData = new FormData();
        formData.append('title', title);
        formData.append('content', content);
        if (image) formData.append('image', image);

        try {
            const res = await fetch(`${BASE_URL}/${id}`, {
                method: 'PUT', body: formData, credentials: 'include'
            });
            const result = await res.json();
            if (res.ok) {
                Swal.fire({
                    icon: 'success',
                    title: 'Updated!',
                    text: result.message || 'Post updated successfully!',
                    timer: 1500,
                    showConfirmButton: false
                });
                loadMyPosts();
                setTimeout(() => editModal.hide(), 1200);
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Update Failed',
                    text: result.message || 'Failed to update'
                });
            }
        } catch (err) {
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'Error updating post'
            });
        }
    });

    document.getElementById('postForm').addEventListener('submit', async e=>{
        e.preventDefault();
        document.getElementById('postError').style.display='none';
        document.getElementById('postSuccess').style.display='none';
        const title = document.getElementById('title').value.trim();
        const content = document.getElementById('content').value.trim();
        const image = document.getElementById('image').files[0];

        if(!title || !content){
            document.getElementById('postError').textContent='Title and content required';
            document.getElementById('postError').style.display='block';
            return;
        }
        const formData = new FormData();
        formData.append('title', title);
        formData.append('content', content);
        if(image) formData.append('image', image);

        try {
            const res = await fetch(BASE_URL, { method:'POST', body:formData, credentials:'include' });
            const result = await res.json();
            if(res.ok){
                Swal.fire({
                    icon: 'success',
                    title: 'Post Created!',
                    text: 'Your post was created successfully and is waiting for admin approval.',
                    timer: 2000,
                    showConfirmButton: false
                });
                document.getElementById('postForm').reset();
                loadMyPosts();
            }
            else {
                document.getElementById('postError').textContent=result.message || 'Failed';
                document.getElementById('postError').style.display='block';
            }
        } catch(err){
            document.getElementById('postError').textContent='Error creating post';
            document.getElementById('postError').style.display='block';
        }
    });

    async function deletePost(postId){
        const result = await Swal.fire({
            title: 'Are you sure?',
            text: "Do you really want to delete this post?",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#fd6537',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Yes, delete it!',
            cancelButtonText: 'Cancel'
        });
        if (!result.isConfirmed) return;
        try {
            const res = await fetch(`${BASE_URL}/${postId}`, { method:'DELETE', credentials:'include' });
            const resultJson = await res.json();
            if(res.ok){
                Swal.fire({
                    icon: 'success',
                    title: 'Deleted!',
                    text: resultJson.message || "Deleted successfully",
                    timer: 1500,
                    showConfirmButton: false
                });
                loadMyPosts();
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Delete Failed',
                    text: resultJson.message || "Failed to delete"
                });
            }
        } catch(err){
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: "Error deleting post"
            });
        }
    }


    document.addEventListener('DOMContentLoaded', loadMyPosts);
</script>
</body>
</html>
