<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { margin-top: 20px; }
        .card { margin-bottom: 20px; }
        .error { color: red; display: none; }
        .success { color: green; display: none; }
        .post-image { max-width: 200px; max-height: 200px; object-fit: cover; }
    </style>
</head>
<body>
<div class="container">
    <h1 class="text-center mb-4">Blog Post Management</h1>

    <!-- Create Post Form -->
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Create New Post</h5>
            <form id="postForm" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" required>
                </div>
                <div class="mb-3">
                    <label for="content" class="form-label">Content</label>
                    <textarea class="form-control" id="content" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="author" class="form-label">Author</label>
                    <input type="text" class="form-control" id="author" required>
                </div>
                <div class="mb-3">
                    <label for="image" class="form-label">Upload Image</label>
                    <input type="file" class="form-control" id="image" accept="image/*">
                </div>
                <button type="submit" class="btn btn-primary">Submit Post</button>
            </form>
            <div id="postError" class="error"></div>
            <div id="postSuccess" class="success"></div>
        </div>
    </div>

    <!-- Posts List -->
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">All Posts</h5>
            <div id="postsList"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
<script>
    const BASE_URL = 'http://localhost:8080/api/posts';

    // Fetch and display all posts
    async function loadPosts() {
        try {
            const response = await fetch(BASE_URL, { method: 'GET', credentials: 'include' });
            const data = await response.json();
            const posts = data.data;
            const postsList = document.getElementById('postsList');
            postsList.innerHTML = posts.map(post => `
                    <div class="card mb-2">
                        <div class="card-body">
                            <h5 class="card-title">${post.title}</h5>
                            <p class="card-text">${post.content}</p>
                            <p class="card-text"><small>By ${post.author} on ${new Date(post.createdDate).toLocaleString()}</small></p>
                            ${post.imagePath ? `<img src="/uploads/${post.imagePath}" alt="Post Image" class="post-image mb-2">` : ''}
                            <button class="btn btn-danger delete-btn" data-id="${post.id}">Delete</button>
                        </div>
                    </div>
                `).join('');
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (confirm('Are you sure you want to delete this post?')) {
                        await deletePost(btn.getAttribute('data-id'));
                    }
                });
            });
        } catch (error) {
            console.error('Error loading posts:', error);
        }
    }

    // Create a new post
    document.getElementById('postForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData();
        formData.append('post', new Blob([JSON.stringify({
            title: document.getElementById('title').value,
            content: document.getElementById('content').value,
            author: document.getElementById('author').value,
            createdDate: new Date().toISOString()
        })], { type: 'application/json' }));
        const imageInput = document.getElementById('image');
        if (imageInput.files[0]) {
            formData.append('image', imageInput.files[0]);
        }

        try {
            const response = await fetch(BASE_URL, {
                method: 'POST',
                credentials: 'include',
                body: formData
            });
            const data = await response.json();
            document.getElementById('postError').style.display = 'none';
            document.getElementById('postSuccess').textContent = data.message;
            document.getElementById('postSuccess').style.display = 'block';
            document.getElementById('postForm').reset();
            loadPosts(); // Refresh posts list
        } catch (error) {
            document.getElementById('postError').textContent = error.message || 'Failed to create post';
            document.getElementById('postError').style.display = 'block';
        }
    });

    // Delete a post
    async function deletePost(id) {
        try {
            const response = await fetch(`${BASE_URL}/${id}`, {
                method: 'DELETE',
                credentials: 'include'
            });
            const data = await response.json();
            document.getElementById('postSuccess').textContent = data.message;
            document.getElementById('postSuccess').style.display = 'block';
            loadPosts(); // Refresh posts list
        } catch (error) {
            document.getElementById('postError').textContent = error.message || 'Failed to delete post';
            document.getElementById('postError').style.display = 'block';
        }
    }

    // Load posts on page load
    document.addEventListener('DOMContentLoaded', loadPosts);
</script>
</body>
</html>
