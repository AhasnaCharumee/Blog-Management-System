<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Group Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@4.7.0/dist/emoji-button.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <!-- WebSocket libs -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <link rel="icon" href="../images/download.png" type="image/x-icon" />

  <!-- Emoji picker (ES module) -->
  <script type="module">
    import { EmojiButton } from 'https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@4.7.0/dist/index.js';
    window.EmojiButton = EmojiButton; // make global
  </script>

  <style>
    body { background-color: #000000; }
    #chat { height: 70vh; overflow-y: scroll; background: #fff; padding: 15px; border-radius: 12px; border: 1px solid #ddd; }
    .message-wrapper { display: flex; margin-bottom: 12px; flex-wrap: wrap; }
    .message-left { justify-content: flex-start; }
    .message-right { justify-content: flex-end; }
    .bubble { max-width: 70%; padding: 10px 15px; border-radius: 15px; word-wrap: break-word; display: flex; flex-direction: column; }
    .bubble-left { background-color: #e2e3e5; border-top-left-radius: 0; }
    .bubble-right { background-color: #f87148; color: #fff; border-top-right-radius: 0; }
    .sender { font-weight: bold; margin-bottom: 5px; }
    .timestamp { font-size: 0.7rem; color: gray; margin-top: 5px; align-self: flex-end; }
    img.chat-img { max-width: 150px; max-height: 150px; border-radius: 8px; margin-top: 5px; display: block; }
    img.profile-img { width: 40px; height: 40px; border-radius: 50%; margin-right: 10px; object-fit: cover; }
    .bubble-content { display: flex; align-items: flex-start; flex-wrap: wrap; }
    .bubble-text { display: flex; flex-direction: column; }
    @media(max-width: 576px) { .bubble { max-width: 90%; } #chat { height: 60vh; } }
    .input-group { margin-top: 15px; }
  </style>
</head>
<body class="container py-3">
<h2 class="mb-4 text-center" style="color: orangered">Chat With Bloggers </h2>
<div class="position-fixed top-0 end-0 m-3">
  <a href="my_account.html" title="Go to My Account">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="background-color: orangered; border-radius: 50%;color: white">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </a>
</div>

<div id="chat" class="mb-3"></div>
<div class="input-group mb-3">
<!--  <button type="button" class="btn btn-light" id="emojiBtn">😀</button>-->
  <input type="text" id="message" class="form-control" placeholder="Type a message..." autocomplete="off">
  <input type="file" id="imageInput" accept="image/*" class="form-control">
  <button id="sendBtn" class="btn btn-primary" style="background-color: orangered">Send</button>
</div>

<script>
  let stompClient = null;
  let currentUser = "Anonymous";

  function formatTimestamp(ts) {
    const date = new Date(ts);
    let hours = date.getHours();
    let minutes = date.getMinutes();
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    minutes = minutes < 10 ? '0' + minutes : minutes;
    return `${hours}:${minutes} ${ampm}`;
  }

  async function fetchUserInfo() {
    try {
      const res = await fetch('http://localhost:8080/api/users/me', { credentials: 'include' });
      if (!res.ok) throw new Error('User data unavailable');
      const data = await res.json();
      currentUser = data.name || "Anonymous";
    } catch (err) {
      console.error("Error fetching user info:", err);
      currentUser = "Anonymous";
    }
  }

  async function loadPreviousMessages() {
    try {
      const res = await fetch('http://localhost:8080/api/chat/messages', { credentials: 'include' });
      const messages = await res.json();
      if (Array.isArray(messages)) messages.forEach(msg => displayMessage(msg));
    } catch (err) {
      console.error("Error loading messages:", err);
    }
  }

  function connect() {
    const socket = new SockJS("http://localhost:8080/chat-websocket");
    stompClient = Stomp.over(socket);
    stompClient.connect({}, frame => {
      console.log("Connected: " + frame);
      stompClient.subscribe("/topic/public", message => {
        const msg = JSON.parse(message.body);
        displayMessage(msg);
      });
    }, error => console.error("Connection error:", error));
  }

  function getInitials(name) {
    if (!name) return "?";
    const parts = name.trim().split(" ");
    const first = parts[0].charAt(0).toUpperCase();
    const last = parts.length > 1 ? parts[parts.length - 1].charAt(0).toUpperCase() : '';
    return first + last;
  }

  function stringToColor(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    const color = Math.floor(Math.abs(Math.sin(hash) * 16777215) % 16777215).toString(16);
    return "#" + "000000".substring(0, 6 - color.length) + color;
  }

  function setInitialsAvatar(imgElement, username) {
    const initials = getInitials(username);
    const canvas = document.createElement('canvas');
    canvas.width = 40;
    canvas.height = 40;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = stringToColor(username);
    ctx.beginPath();
    ctx.arc(20, 20, 20, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = "bold 16px Arial";
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(initials, canvas.width / 2, canvas.height / 2);

    imgElement.src = canvas.toDataURL();
  }

  function displayMessage(msg) {
    const isCurrentUser = msg.sender === currentUser;
    const wrapper = document.createElement("div");
    wrapper.classList.add("message-wrapper", isCurrentUser ? "message-right" : "message-left");

    const bubble = document.createElement("div");
    bubble.classList.add("bubble", isCurrentUser ? "bubble-right" : "bubble-left");

    const contentDiv = document.createElement("div");
    contentDiv.classList.add("bubble-content");

    // Avatar (Always initials + color)
    if (!isCurrentUser) {
      const profileImg = document.createElement("img");
      profileImg.classList.add("profile-img");
      setInitialsAvatar(profileImg, msg.sender);
      contentDiv.appendChild(profileImg);
    }

    const textDiv = document.createElement("div");
    textDiv.classList.add("bubble-text");
    textDiv.innerHTML = `<span class="sender">${msg.sender}</span><span>${msg.content || ''}</span>`;

    if (msg.imageUrl) {
      const img = document.createElement("img");
      img.src = msg.imageUrl;
      img.classList.add("chat-img");
      img.onerror = () => img.style.display = 'none';
      textDiv.appendChild(img);
    }

    textDiv.innerHTML += `<span class="timestamp">${msg.timestamp ? formatTimestamp(msg.timestamp) : ''}</span>`;
    contentDiv.appendChild(textDiv);
    bubble.appendChild(contentDiv);
    wrapper.appendChild(bubble);
    document.getElementById("chat").appendChild(wrapper);
    document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('message');
    const imageInput = document.getElementById('imageInput');

    if (input.value.trim() === '' && (!imageInput.files || imageInput.files.length === 0)) return;

    if (imageInput.files.length > 0) {
      const reader = new FileReader();
      reader.onload = e => send(input.value.trim(), e.target.result);
      reader.readAsDataURL(imageInput.files[0]);
    } else {
      send(input.value.trim(), null);
    }
  }

  function send(content, imageUrl) {
    if (!stompClient || !stompClient.connected) {
      console.error("WebSocket not connected. Reconnecting...");
      connect();
      return;
    }
    stompClient.send("/app/sendMessage", {}, JSON.stringify({
      sender: currentUser,
      content: content,
      imageUrl: imageUrl
    }));
    document.getElementById('message').value = '';
    document.getElementById('imageInput').value = '';
  }

  document.getElementById('sendBtn').addEventListener('click', sendMessage);
  document.getElementById('message').addEventListener('keyup', e => {
    if (e.key === "Enter") sendMessage();
  });

  window.addEventListener('load', async () => {
    await fetchUserInfo();
    connect();
    loadPreviousMessages();

    if (window.EmojiButton) {
      const emojiPicker = new EmojiButton({ position: 'top-start', autoHide: true });
      const emojiBtn = document.getElementById('emojiBtn');
      const messageInput = document.getElementById('message');

      emojiBtn.addEventListener('click', () => emojiPicker.togglePicker(emojiBtn));

      emojiPicker.on('emoji', emoji => {
        messageInput.value += emoji;
        messageInput.focus();
      });

    }

  });
</script>

</body>
</html>
