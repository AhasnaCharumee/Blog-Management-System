<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Collection - BlogSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="../images/download.png" type="image/x-icon" />
    <style>
        :root {
            --bg-1: #0f0f10;
            --bg-2: #1a1b1e;
            --panel: rgba(255, 255, 255, 0.06);
            --panel-border: rgba(255, 255, 255, 0.12);
            --text: #ff6700;
            --muted: #b6b6b6;
            --brand: #fd6537;
            --brand-700: #e24c1e;
            --brand-800: #c53e15;
            --accent: #ffb089;
            --focus: rgba(253, 101, 55, 0.35);
            --glass: rgba(255, 255, 255, 0.08);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial;
            background: radial-gradient(1200px 600px at 10% -10%, rgba(253, 101, 55, 0.18), transparent 60%),
            radial-gradient(1000px 500px at 110% 10%, rgba(253, 101, 55, 0.12), transparent 60%),
            linear-gradient(135deg, var(--bg-1), var(--bg-2));
            overflow-x: hidden;
        }


        .table-container {
            margin: 100px auto 50px auto;
            max-width: 1200px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .table th, .table td { vertical-align: middle; color: #000; }
        .btn-view {
            background: #fd6537;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-view:hover { background: #ff835e; }
        .post-image {
            max-width: 80px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
        }
        .fade-in { animation: fadeIn 0.6s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .pagination li button {
            background: rgba(255,255,255,0.05);
            color: #fd6537;
            border: none;
            margin: 0 2px;
            border-radius: 6px;
        }
        .pagination li.active button {
            background: #fd6537;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="table-container fade-in">
    <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-primary" onclick="window.location.href='./admin.html'">Back to Dashboard</button>
    </div>
    <h2 class="text-center mb-4">All Published Posts</h2>

    <div class="mb-3">
        <input type="text" id="searchBar" class="form-control" placeholder="Search posts by title...">
    </div>

    <table class="table table-hover">
        <thead class="table-light text-dark">
        <tr>
            <th>Image</th>
            <th>Post Title</th>
            <th>Author</th>
            <th>Likes</th>
            <th>Comments</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="postTableBody"></tbody>
    </table>

    <nav>
        <ul class="pagination justify-content-center" id="pagination"></ul>
    </nav>
</div>

<!-- Modal to show only comments -->
<div class="modal fade" id="commentsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" style="background: rgba(34,34,34,0.9); color: #f6f2e9; border-radius: 16px;">
            <div class="modal-header border-0">
                <h5 class="modal-title">Comments</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <ul class="list-group" id="commentsList"></ul>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080/api/posts/published';
    const COMMENTS_API = 'http://localhost:8080/api/posts';
    let allPosts = [];
    let pageSize = 5;
    let currentPage = 1;

    async function fetchPosts() {
        try {
            const res = await fetch(API_URL);
            if(!res.ok) throw new Error("Failed to fetch posts");
            const result = await res.json();
            allPosts = result.data || [];
            renderTable();
            renderPagination();
        } catch(err) {
            console.error(err);
            document.getElementById('postTableBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger">Failed to load posts</td></tr>`;
        }
    }

    function renderTable() {
        const tableBody = document.getElementById('postTableBody');
        const query = document.getElementById('searchBar').value.toLowerCase();

        let filtered = allPosts.filter(p => p.title.toLowerCase().includes(query));
        const totalPages = Math.ceil(filtered.length / pageSize);
        if(currentPage > totalPages) currentPage = 1;

        const start = (currentPage - 1) * pageSize;
        const pagePosts = filtered.slice(start, start + pageSize);

        if(!pagePosts.length) {
            tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No posts found</td></tr>`;
            return;
        }

        tableBody.innerHTML = pagePosts.map(post => `
        <tr class="fade-in">
            <td>${post.imagePath ? `<img src="/uploads/${post.imagePath}" class="post-image">` : ''}</td>
            <td>${post.title}</td>
            <td>${post.author || 'Unknown'}</td>
            <td>${post.likes}</td>
            <td>${post.commentsCount}</td>
            <td><button class="btn-view" onclick="viewComments(${post.id})">View Comments</button></td>
        </tr>
    `).join('');
    }

    function renderPagination() {
        const query = document.getElementById('searchBar').value.toLowerCase();
        const filtered = allPosts.filter(p => p.title.toLowerCase().includes(query));
        const totalPages = Math.ceil(filtered.length / pageSize);

        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';
        for(let i = 1; i <= totalPages; i++){
            pagination.innerHTML += `
            <li class="page-item ${i === currentPage ? 'active' : ''}">
                <button class="page-link" onclick="goToPage(${i})">${i}</button>
            </li>
        `;
        }
    }

    function goToPage(page) {
        currentPage = page;
        renderTable();
        renderPagination();
    }

    async function viewComments(postId) {
        try {
            const res = await fetch(`${COMMENTS_API}/${postId}/comments`);
            if(!res.ok) throw new Error("Failed to fetch comments");
            const data = await res.json();
            const commentsList = document.getElementById('commentsList');
            if(data.data.length === 0){
                commentsList.innerHTML = `<li class="list-group-item text-center">No comments yet.</li>`;
            } else {
                commentsList.innerHTML = data.data.map(c => `
                <li class="list-group-item">
                    <strong>${c.authorName}:</strong> ${c.content}
                </li>
            `).join('');
            }
            new bootstrap.Modal(document.getElementById('commentsModal')).show();
        } catch(err) {
            console.error(err);
            alert("Failed to load comments");
        }
    }

    document.addEventListener('DOMContentLoaded', fetchPosts);
    document.getElementById('searchBar').addEventListener('input', () => {
        currentPage = 1;
        renderTable();
        renderPagination();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
