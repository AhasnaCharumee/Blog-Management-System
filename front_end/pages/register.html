<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Login - BlogSphere</title>
    <link rel="icon" href="../images/download.png" type="image/x-icon" />

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
            color: #e0e0e0;
        }

        /* floating background glow */
        body::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                    from 180deg at 50% 50%,
                    #fd6537,
                    #ff9966,
                    #2d2d2d,
                    #1a1a1a,
                    #fd6537
            );
            animation: spin 18s linear infinite;
            opacity: 0.15;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 100%;
            max-width: 400px;
            z-index: 1;
            animation: fadeIn 1.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: #fd6537;
            font-weight: 700;
        }

        button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #fd6537, #ff9966);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 6px 20px rgba(253, 101, 55, 0.35);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            width: 100%;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 25px rgba(253, 101, 55, 0.5);
        }

        button svg {
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            padding: 2px;
        }

        a {
            color: #ff844a;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #ffaa82;
            text-decoration: underline;
        }

        p {
            font-size: 0.9rem;
            margin: 1rem 0;
            line-height: 1.5;
        }

        img {
            max-width: 60%;
            margin-bottom: 1rem;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>

    <script>
        function openGoogleLogin() {
            window.open(
                'http://localhost:8080/oauth2/authorization/google',
                'GoogleLogin',
                'width=500,height=600'
            );
            return false;
        }
    </script>
</head>
<body>
<div class="container">
    <div><img src="../images/download.png" alt="BlogSphere Logo"></div>
    <h1>Join BlogSphere</h1>
    <button onclick="openGoogleLogin()">
        <svg viewBox="0 0 48 48">
            <g>
                <path fill="#4285F4" d="M44.5 20H24v8.5h11.7C34.7 33.1 30.1 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.1 8.1 2.9l6.1-6.1C34.5 6.5 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.2-4z"/>
                <path fill="#34A853" d="M6.3 14.7l7 5.1C15.5 16.1 19.4 13 24 13c3.1 0 5.9 1.1 8.1 2.9l6.1-6.1C34.5 6.5 29.6 4 24 4c-7.2 0-13.4 4.1-16.7 10.7z"/>
                <path fill="#FBBC05" d="M24 44c5.6 0 10.5-1.9 14.3-5.1l-6.6-5.4C29.7 35.5 27 36.5 24 36.5c-6.1 0-10.7-2.9-13.7-7.1l-7 5.4C6.6 39.9 14.1 44 24 44z"/>
                <path fill="#EA4335" d="M44.5 20H24v8.5h11.7c-1.2 3.2-4.1 5.5-7.7 5.5-4.6 0-8.4-3.8-8.4-8.5s3.8-8.5 8.4-8.5c2.5 0 4.7.9 6.3 2.4l6.1-6.1C38.9 10.1 32.1 7 24 7c-8.1 0-15.1 4.7-18.7 11.7l7 5.1C15.5 16.1 19.4 13 24 13c3.1 0 5.9 1.1 8.1 2.9l6.1-6.1C34.5 6.5 29.6 4 24 4c-7.2 0-13.4 4.1-16.7 10.7z"/>
            </g>
        </svg>
        Sign up with Google
    </button>
    <p>Already have an account? <a href="Login.html">Login</a></p>
    <p>Click "Sign up" to agree to BlogSphere's Terms of Service and acknowledge that BlogSphere's Privacy Policy applies to you.</p>
</div>
</body>
</html>
