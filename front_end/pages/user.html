<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - BlogSphere</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="icon" href="../images/download.png" type="image/x-icon" />


    <style>
        :root {
            --bg-1: #0f0f10;
            --bg-2: #1a1b1e;
            --panel: rgba(255, 255, 255, 0.06);
            --panel-border: rgba(255, 255, 255, 0.12);
            --text: #eaeaea;
            --muted: #b6b6b6;
            --brand: #fd6537;
            --brand-700: #e24c1e;
            --brand-800: #c53e15;
            --accent: #ffb089;
            --focus: rgba(253, 101, 55, 0.35);
            --glass: rgba(255, 255, 255, 0.08);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial;
            background: radial-gradient(1200px 600px at 10% -10%, rgba(253, 101, 55, 0.18), transparent 60%),
            radial-gradient(1000px 500px at 110% 10%, rgba(253, 101, 55, 0.12), transparent 60%),
            linear-gradient(135deg, var(--bg-1), var(--bg-2));
            overflow-x: hidden;
        }

        .aurora {
            position: fixed;
            inset: -20vmax;
            pointer-events: none;
            background: radial-gradient(closest-side, rgba(253, 101, 55, 0.18), transparent 80%) 0 0 / 60vmax 60vmax,
            radial-gradient(closest-side, rgba(255, 176, 137, 0.13), transparent 80%) 100% 30% / 70vmax 70vmax,
            radial-gradient(closest-side, rgba(255, 255, 255, 0.05), transparent 80%) 50% 100% / 80vmax 80vmax;
            animation: floaty 18s ease-in-out infinite alternate;
            filter: blur(30px);
            opacity: 0.75;
        }
        @keyframes floaty {
            from { transform: translate3d(-2%, -1%, 0) rotate(0.5deg) scale(1.02); }
            to   { transform: translate3d(2%, 1%, 0) rotate(-0.5deg) scale(1.05); }
        }

        .wrap {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 16px;
        }

        .card-glass {
            width: 100%;
            max-width: 1000px;
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
            backdrop-filter: blur(14px) saturate(120%);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
        }

        .card-glass::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.08) 50%, transparent 70%);
            transform: translateX(-100%);
            animation: sheen 5.5s ease-in-out infinite;
        }
        @keyframes sheen {
            0%, 12% { transform: translateX(-100%); }
            50%     { transform: translateX(100%); }
            100%    { transform: translateX(100%); }
        }

        .card-body { padding: 28px; }

        h1.title {
            font-size: clamp(1.5rem, 1.2rem + 0.8vw, 2rem);
            text-align: center;
            margin-bottom: 24px;
        }

        table {
            color: var(--text);
        }

        .profile-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .btn-delete {
            background: #ff4d4f;
            border: none;
            color: white;
            border-radius: 6px;
        }
        .btn-delete:hover { background: #e64545; }

        .animate-in { animation: rise 420ms cubic-bezier(.2,.8,.2,1) both; }
        @keyframes rise {
            from { opacity: 0; transform: translateY(14px) scale(0.992); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<div class="wrap">
    <div class="card-glass animate-in">
        <div class="card-body">
            <!-- Add this inside card-body, before <h1 class="title"> -->
            <div class="d-flex justify-content-end mb-3">
                <button class="btn btn-primary" onclick="window.location.href='./admin.html'">Back to Dashboard</button>
            </div>

            <h1 class="title">Users Management</h1>
            <div id="errorMessage" class="mb-3" style="display:none;"></div>

            <table class="table table-dark table-hover">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Profile</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Bio</th>
                </tr>
                </thead>
                <tbody id="usersTable">
                <!-- Users will populate here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem("token");
    const errorMessage = document.getElementById("errorMessage");

    async function fetchUsers() {
        try {
            const res = await fetch("http://localhost:8080/api/users", {
                headers: { "Authorization": "Bearer " + token }
            });

            if (!res.ok) throw new Error("Failed to fetch users");

            const users = await res.json();
            const tbody = document.getElementById("usersTable");
            tbody.innerHTML = "";

            users.forEach(user => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${user.id}</td>
                    <td><img src="http://localhost:8080/uploads/${user.profileImagePath || 'default.png'}" class="profile-img" /></td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>${user.bio || ""}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            errorMessage.style.display = "block";
            errorMessage.textContent = err.message;
        }
    }

    async function deleteUser(id) {
        if (!confirm("Are you sure you want to delete this user?")) return;
        try {
            const res = await fetch(`http://localhost:8080/api/users/${id}`, {
                method: "DELETE",
                headers: { "Authorization": "Bearer " + token }
            });
            if (!res.ok) throw new Error("Failed to delete user");
            fetchUsers(); // refresh table
        } catch (err) {
            alert(err.message);
        }
    }

    fetchUsers();

</script>
</body>
</html>
