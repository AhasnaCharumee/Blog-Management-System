<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - BlogSphere</title>

    <!-- Bootstrap core -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

    <!-- Favicon -->
    <link rel="icon" href="../images/download.png" type="image/x-icon" />

    <style>
        :root {
            --bg-1: #0f0f10;
            --bg-2: #1a1b1e;
            --panel: rgba(255, 255, 255, 0.06);
            --panel-border: rgba(255, 255, 255, 0.12);
            --text: #eaeaea;
            --muted: #b6b6b6;
            --brand: #fd6537; /* primary orange */
            --brand-700: #e24c1e;
            --brand-800: #c53e15;
            --accent: #ffb089;
            --focus: rgba(253, 101, 55, 0.35);
            --glass: rgba(255, 255, 255, 0.08);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }

        /* ===== Page background with animated gradient + subtle grid ===== */
        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            background: radial-gradient(1200px 600px at 10% -10%, rgba(253, 101, 55, 0.18), transparent 60%),
            radial-gradient(1000px 500px at 110% 10%, rgba(253, 101, 55, 0.12), transparent 60%),
            linear-gradient(135deg, var(--bg-1), var(--bg-2));
            overflow-x: hidden;
        }

        /* Animated aurora blob */
        .aurora {
            position: fixed;
            inset: -20vmax;
            pointer-events: none;
            background: radial-gradient(closest-side, rgba(253, 101, 55, 0.18), transparent 80%) 0 0 / 60vmax 60vmax,
            radial-gradient(closest-side, rgba(255, 176, 137, 0.13), transparent 80%) 100% 30% / 70vmax 70vmax,
            radial-gradient(closest-side, rgba(255, 255, 255, 0.05), transparent 80%) 50% 100% / 80vmax 80vmax;
            animation: floaty 18s ease-in-out infinite alternate;
            filter: blur(30px);
            opacity: 0.75;
        }
        @keyframes floaty {
            from { transform: translate3d(-2%, -1%, 0) rotate(0.5deg) scale(1.02); }
            to   { transform: translate3d(2%, 1%, 0) rotate(-0.5deg) scale(1.05); }
        }

        /* ===== Centered layout ===== */
        .wrap {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 16px;
        }

        /* ===== Glass card ===== */
        .card-glass {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
            backdrop-filter: blur(14px) saturate(120%);
            -webkit-backdrop-filter: blur(14px) saturate(120%);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        /* light sweep accent */
        .card-glass::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.08) 50%, transparent 70%);
            transform: translateX(-100%);
            animation: sheen 5.5s ease-in-out infinite;
        }
        @keyframes sheen {
            0%, 12% { transform: translateX(-100%); }
            50%     { transform: translateX(100%); }
            100%    { transform: translateX(100%); }
        }

        .card-body { padding: 28px; }

        /* ===== Header ===== */
        .brand-mark {
            width: 84px; height: 84px;
            border-radius: 20px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), rgba(255,255,255,0.02));
            border: 1px solid var(--panel-border);
            display: grid; place-items: center;
            margin-inline: auto; margin-top: 18px; margin-bottom: 12px;
            box-shadow: 0 8px 24px rgba(253, 101, 55, 0.22);
            overflow: hidden;
        }
        .brand-mark img { width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4)); }

        h1.title {
            font-size: clamp(1.35rem, 1.2rem + 0.8vw, 1.75rem);
            text-align: center;
            color: var(--text);
            margin: 4px 0 16px;
            letter-spacing: 0.2px;
        }
        .subtitle{
            font-size: 0.95rem;
            text-align: center;
            color: var(--muted);
            margin-bottom: 16px;
        }

        /* ===== Form ===== */
        label.form-label { color: var(--accent); font-weight: 600; }

        .form-control {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--text);
            border-radius: 12px;
            padding: 10px 12px;
            transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
        }
        .form-control::placeholder { color: #9aa0a6; }
        .form-control:focus {
            background: rgba(255,255,255,0.1);
            border-color: var(--brand);
            box-shadow: 0 0 0 0.25rem var(--focus);
            color: var(--text);
            transform: translateY(-1px);
        }

        /* ===== Buttons ===== */
        .btn-primary { /* admin login */
            --bs-btn-bg: linear-gradient(180deg, var(--brand), var(--brand-700));
            --bs-btn-border-color: transparent;
            --bs-btn-hover-bg: linear-gradient(180deg, var(--brand-700), var(--brand-800));
            --bs-btn-disabled-bg: #444;
            border: 0;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(253, 101, 55, 0.25);
            transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(253,101,55,0.35); }
        .btn-primary:active { transform: translateY(0); }

        .btn-google {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%;
            border-radius: 12px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.14);
            background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
            color: #fff; text-decoration: none;
            padding: 10px 12px;
            transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }
        .btn-google:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,0,0,0.35); }
        .btn-google:active { transform: translateY(0); }
        .icon-google { flex: 0 0 auto; }

        /* Links */
        a.link { color: #8ab4f8; text-decoration: none; }
        a.link:hover { text-decoration: underline; }

        /* Error message */
        #errorMessage {
            background: rgba(255, 65, 54, 0.08);
            border: 1px solid rgba(255, 65, 54, 0.25);
            color: #ffb4ad;
            border-radius: 10px;
            padding: 10px 12px;
        }

        /* Divider */
        .divider {
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
            color: var(--muted); font-size: 0.9rem; margin: 14px 0;
        }
        .divider::before, .divider::after { content: ""; height: 1px; background: rgba(255,255,255,0.14); }

        /* Subtle entrance animation */
        .animate-in { animation: rise 420ms cubic-bezier(.2,.8,.2,1) both; }
        @keyframes rise {
            from { opacity: 0; transform: translateY(14px) scale(0.992); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Footer note */
        .foot-note { text-align: center; color: var(--muted); font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<div class="wrap">
    <div class="card-glass animate-in">
        <div class="card-body">
            <div class="brand-mark"><img src="../images/download.png" alt="BlogSphere" /></div>
            <h1 class="title">Welcome back</h1>
            <p class="subtitle">Sign in to access your dashboard</p>

            <!-- Admin login form (unchanged IDs & names for existing JS logic) -->
            <form id="adminLoginForm" class="mt-3">
                <div class="mb-3">
                    <label for="adminEmail" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="adminEmail" name="email" placeholder="you@example.com" required />
                </div>
                <div class="mb-3">
                    <label for="adminPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="adminPassword" name="password" placeholder="••••••••" required />
                </div>
                <button type="submit" class="btn btn-primary w-100">Login as Admin</button>
            </form>

            <div class="divider">or</div>

            <!-- Google OAuth (kept as link; styling only) -->
            <a href="http://localhost:8080/oauth2/authorization/google" class="btn-google" id="googleLogin">
                <svg class="icon-google" width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
                    <g>
                        <path fill="#4285F4" d="M44.5 20H24v8.5h11.7C34.7 33.1 30.1 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.1 8.1 2.9l6.1-6.1C34.5 6.5 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.2-4z"/>
                        <path fill="#34A853" d="M6.3 14.7l7 5.1C15.5 16.1 19.4 13 24 13c3.1 0 5.9 1.1 8.1 2.9l6.1-6.1C34.5 6.5 29.6 4 24 4c-7.2 0-13.4 4.1-16.7 10.7z"/>
                        <path fill="#FBBC05" d="M24 44c5.6 0 10.5-1.9 14.3-5.1l-6.6-5.4C29.7 35.5 27 36.5 24 36.5c-6.1 0-10.7-2.9-13.7-7.1l-7 5.4C6.6 39.9 14.1 44 24 44z"/>
                        <path fill="#EA4335" d="M44.5 20H24v8.5h11.7c-1.2 3.2-4.1 5.5-7.7 5.5-4.6 0-8.4-3.8-8.4-8.5s3.8-8.5 8.4-8.5c2.5 0 4.7.9 6.3 2.4l6.1-6.1C38.9 10.1 32.1 7 24 7c-8.1 0-15.1 4.7-18.7 11.7l7 5.1C15.5 16.1 19.4 13 24 13c3.1 0 5.9 1.1 8.1 2.9l6.1-6.1C34.5 6.5 29.6 4 24 4c-7.2 0-13.4 4.1-16.7 10.7z"/>
                    </g>
                </svg>
                Login with Google
            </a>

            <p class="foot-note mt-3">Don't have an account? <a class="link" href="register.html">Register</a></p>

            <div id="errorMessage" class="mt-3" style="display:none;"></div>
        </div>
    </div>
</div>

<!-- Keep your existing JS logic exactly the same -->
<script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('adminEmail').value;
        const password = document.getElementById('adminPassword').value;
        const errorMessage = document.getElementById('errorMessage');

        const response = await fetch('http://localhost:8080/api/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                // 'Authorization': 'Bearer ' + localStorage.getItem('token'),
            },
            body: JSON.stringify({ email, password })
        });

        if (response.ok) {
            const data = await response.json();
            localStorage.setItem("token", data.data);
            window.location.href = "./admin.html";
        } else {
            const error = await response.json();
            errorMessage.textContent = 'Login failed: ' + (error.message || 'Invalid credentials');
            errorMessage.style.display = 'block';
        }
    });
</script>
</body>
</html>
