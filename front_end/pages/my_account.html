<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Account - BlogSphere</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="../images/download.png" type="image/x-icon" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Source Sans Pro', sans-serif; line-height:1.6; transition:all 0.3s ease; }
        body.light-mode { background: linear-gradient(135deg, #FFE5B4 0%, #FFAB76 100%); color:#2d3748; }
        body.dark-mode { background: linear-gradient(135deg, #2C1E0A 0%, #4D3319 50%, #6E482B 100%); color:#fff; }

        .navbar-custom {
            background: rgba(20,20,20,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,140,0,0.2);
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
            position: sticky;
            top:0;
            z-index:1000;
        }
        .navbar-brand { font-family:'Playfair Display', serif; font-weight:700; font-size:1.5rem; color:#FFA500 !important; }

        .btn-nav {
            background: linear-gradient(135deg,#FFA500,#FF8C00);
            border:none;
            color:#fff !important;
            padding:10px 20px;
            border-radius:12px;
            font-weight:600;
            transition: all 0.3s ease;
            box-shadow:0 4px 15px rgba(255,140,0,0.3);
        }
        .btn-nav:hover { background: linear-gradient(135deg,#FF8C00,#FF7F50); transform:translateY(-2px); box-shadow:0 8px 25px rgba(255,140,0,0.5); }

        .btn-logout {
            background: rgba(255,69,0,0.2);
            color:#FF4500 !important;
            border:1px solid rgba(255,69,0,0.3);
            border-radius:12px;
            padding:10px 20px;
            font-weight:600;
            transition: all 0.3s ease;
        }
        .btn-logout:hover { background: rgba(255,69,0,0.3); color:#fff !important; transform:translateY(-2px); }

        .btn-toggle {
            background: rgba(107,114,128,0.3);
            border:1px solid rgba(255,255,255,0.2);
            border-radius:12px;
            padding:8px 16px;
            color:#fff;
            font-size:1.2rem;
            transition: all 0.3s ease;
        }
        .btn-toggle:hover { background: rgba(107,114,128,0.5); transform: scale(1.05); }

        .section-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border:1px solid rgba(255,140,0,0.2);
            border-radius:24px;
            box-shadow:0 12px 40px rgba(0,0,0,0.2);
            padding:2.5rem;
            margin-bottom:2rem;
            transition:all 0.3s ease;
            position:relative;
            overflow:hidden;
            animation: fadeInUp 0.6s ease-out;
        }
        .section-card:hover { transform: translateY(-5px); box-shadow:0 20px 60px rgba(0,0,0,0.3); border-color: rgba(255,140,0,0.3); }

        .profile-img {
            width:120px;
            height:120px;
            border-radius:50%;
            border:3px solid rgba(255,140,0,0.6);
            object-fit:cover;
            box-shadow:0 8px 32px rgba(255,140,0,0.3);
            transition: all 0.3s ease;
        }
        .profile-img:hover { transform: scale(1.05); box-shadow:0 12px 40px rgba(255,140,0,0.5); }

        .post-card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border:1px solid rgba(255,140,0,0.2);
            border-radius:16px;
            box-shadow:0 8px 32px rgba(0,0,0,0.2);
            padding:1.5rem;
            margin:1rem auto;
            max-width:400px;
            transition:all 0.3s ease;
            animation: fadeInUp 0.4s ease-out;
        }
        .post-card:hover { transform:translateY(-3px); box-shadow:0 12px 40px rgba(0,0,0,0.3); border-color: rgba(255,165,0,0.3); }

        .post-header img { width:40px; height:40px; border-radius:50%; object-fit:cover; margin-right:12px; border:2px solid rgba(255,140,0,0.3); }
        .post-header .username { font-weight:600; color:#FFA500; }
        .post-header .date { font-size:0.8rem; color: rgba(255,255,255,0.6); margin-top:2px; }

        .post-content { margin:1rem 0; line-height:1.6; font-size:0.95rem; }
        .post-image { width:100%; max-height:250px; object-fit:cover; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.3); margin:1rem 0; }
        .post-footer { display:flex; flex-direction: row; gap: 10px; }
        .post-footer span { display:flex; align-items:center; gap:5px; color: rgba(255,255,255,0.8); transition:color 0.3s ease; }
        .post-footer span:hover { color:#FFA500; }

        .modal-content {
            background: rgba(20,20,20,0.95) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border:1px solid rgba(255,140,0,0.2);
            border-radius:20px;
            box-shadow:0 20px 60px rgba(0,0,0,0.5);
        }
        .modal-title { font-family:'Playfair Display', serif; font-weight:600; color:#FFA500; }
        .form-control {
            background: rgba(255,255,255,0.1);
            border:1px solid rgba(255,140,0,0.3);
            border-radius:12px;
            color:#fff;
            padding:12px 16px;
        }
        .form-control:focus { background: rgba(255,255,255,0.15); border-color:#FFA500; box-shadow:0 0 0 0.2rem rgba(255,140,0,0.25); color:#fff; }
        .form-label { color: rgba(255,255,255,0.9); font-weight:500; }

        h3,h4,h5 { font-family:'Playfair Display', serif; font-weight:600; }
        h3 { color:#FFA500; } h4 { color:#FFA500; } h5 { color: rgba(255,255,255,0.9); }

        @media(max-width:768px){ .section-card{padding:1.5rem;} .post-card{padding:1rem;margin:0.5rem auto;} .navbar-custom .d-flex{flex-wrap:wrap;gap:0.5rem;} .btn-nav,.btn-logout,.btn-toggle{padding:8px 12px;font-size:0.9rem;} }

        @keyframes fadeInUp { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }
    </style>
</head>
<body class="dark-mode">

<nav class="navbar navbar-expand-lg navbar-custom mb-4">
    <div class="container-fluid">
        <a class="navbar-brand text-light" href="/index.html">
            <img src="../images/download.png" alt="BlogSphere Icon" width="32" class="me-2">BlogSphere
        </a>
        <div class="d-flex">
            <a href="post.html" class="btn btn-nav me-2">+ Create Post</a>
            <a href="published-posts.html" class="btn btn-nav me-2">All Posts</a>
            <button id="darkToggle" class="btn btn-toggle me-2">🌙</button>
            <form action="/logout" method="post" style="display:inline;">
                <button id="logoutButton" class="btn btn-logout">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="section-card text-center">
        <img id="profileImage" class="profile-img mb-3" src="/uploads/default.png" alt="Profile">
        <h3 id="userName">User Name</h3>
        <p id="userEmail" style="color: rgba(255,255,255,0.8); font-size:1.1rem;">user@email.com</p>
        <p id="userBio" style="color: rgba(255,255,255,0.7); font-style: italic;"></p>
        <button class="btn btn-nav mt-3" data-bs-toggle="modal" data-bs-target="#editProfileModal">Edit Profile</button>
    </div>

    <div class="row mb-4">
        <div class="col-md-6">
            <div class="section-card">
                <h5 class="text-center mb-4">Post Interaction Overview</h5>
                <canvas id="interactionPieChart"></canvas>
            </div>
        </div>
        <div class="col-md-6">
            <div class="section-card">
                <h5 class="text-center mb-4">Interaction Breakdown</h5>
                <canvas id="interactionBarChart"></canvas>
            </div>
        </div>
    </div>

    <div class="section-card">
        <h4 class="text-center mb-4">Your Posts</h4>
        <div id="userPosts"></div>
    </div>
</div>

<div class="modal fade" id="editProfileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Profile</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editForm" enctype="multipart/form-data">
                    <input type="hidden" id="userId">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bio</label>
                        <textarea id="bio" class="form-control" rows="3" placeholder="Tell us about yourself..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Profile Image</label>
                        <input type="file" id="profileImageInput" class="form-control" accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-nav w-100">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = "http://localhost:8080/api/users";
    const POSTS_API = "http://localhost:8080/api/posts/me/posts";

    // Theme toggle
    document.getElementById('darkToggle').addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        document.body.classList.toggle('dark-mode');
        document.getElementById('darkToggle').textContent =
            document.body.classList.contains('light-mode') ? "☀️" : "🌙";
        localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    });

    // Load saved theme
    window.addEventListener('load', () => {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.remove('dark-mode');
            document.body.classList.add('light-mode');
            document.getElementById('darkToggle').textContent = "☀️";
        }
    });

    // Load current user
    async function loadUser() {
        try {
            const res = await fetch(`${API_BASE}/me`, {
                credentials: 'include', // important for JWT cookie
                signal: AbortSignal.timeout(3000)
            });

            if (!res.ok) throw new Error('API not available');
            const user = await res.json();
            populateUserData(user);

        } catch (error) {
            console.log('API not available, using mock data for preview');
            const mockUser = {
                id: 1,
                name: "John Doe",
                email: "john.doe@example.com",
                bio: "Passionate blogger and tech enthusiast.",
                profileImagePath: null
            };
            populateUserData(mockUser);
        }
    }

    // Populate user details in HTML
    function populateUserData(user) {
        document.getElementById('userId').value = user.id;
        document.getElementById('name').value = user.name;
        document.getElementById('email').value = user.email;
        document.getElementById('bio').value = user.bio || '';
        document.getElementById('userName').textContent = user.name;
        document.getElementById('userEmail').textContent = user.email;
        document.getElementById('userBio').textContent = user.bio || 'No bio available';

        const profileImg = document.getElementById('profileImage');
        if (user.profileImagePath) {
            profileImg.src = `/uploads/${user.profileImagePath}`;
        } else {
            profileImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=FF8C00&color=fff&size=120`;
        }
    }

    // Logout
    document.getElementById('logoutButton').addEventListener('click', async e => {
        e.preventDefault();
        try {
            const res = await fetch('/logout', {
                method: 'POST',
                credentials: 'include'
            });
            if (res.ok) window.location.href = '/index.html';
            else console.error('Logout failed');
        } catch (err) {
            console.error('Error during logout:', err);
        }
    });

    // Load user posts
    async function loadUserPosts() {
        try {
            const res = await fetch(POSTS_API, {
                credentials: 'include',
                signal: AbortSignal.timeout(3000)
            });
            if (!res.ok) throw new Error('Failed posts');
            const result = await res.json();
            const posts = Array.isArray(result) ? result : (result.data || []);
            displayPosts(posts);
        } catch (error) {
            console.log('API not available, using mock posts for preview');
            const mockPosts = [
                {id:1, content:"Just finished building a UI!", likes:42, commentsCount:8, views:156, createdAt:new Date().toISOString(), user:{name:"John Doe", profileImagePath:null}, imagePath:null},
                {id:2, content:"Working on web projects.", likes:28, commentsCount:5, views:89, createdAt:new Date(Date.now()-86400000).toISOString(), user:{name:"John Doe", profileImagePath:null}, imagePath:null}
            ];
            displayPosts(mockPosts);
        }
    }

    // Display posts in page
    function displayPosts(posts) {
        const container = document.getElementById('userPosts');
        if (posts && posts.length) {
            container.innerHTML = posts.map(renderPostCard).join('');
        } else {
            container.innerHTML = '<p class="text-center" style="color: rgba(255, 255, 255, 0.7);">No posts yet.</p>';
        }
    }

    // Render single post card
    function renderPostCard(post) {
        const date = post.createdAt ? new Date(post.createdAt).toLocaleDateString() : "";
        const profileImg = post.user?.profileImagePath
            ? `/uploads/${post.user.profileImagePath}`
            : `https://ui-avatars.com/api/?name=${encodeURIComponent(post?.author || 'User')}&background=FF8C00&color=fff&size=40`;

        return `
        <div class="post-card">
            <div class="post-header">
                <img src="${profileImg}" alt="profile">
                <div>
                    <div class="username">${post?.author || post.user?.name || 'Unknown User'}</div>
                    <div class="date">${date}</div>
                </div>
            </div>
            <div class="post-content">${post.content}</div>
            ${post.imagePath ? `<img src="/uploads/${post.imagePath}" class="post-image" alt="Post image">` : ''}
            <div class="post-footer">
                <span>👍 ${post.likes || 0}</span>
                <span>💬 ${post.commentsCount || 0}</span>
                <span>👁️ ${post.views || 0}</span>
            </div>
        </div>`;
    }

    // Load interaction stats
    async function loadInteractionStats() {
        try {
            const res = await fetch('http://localhost:8080/api/posts/me/interaction-stats', {
                credentials: 'include',
                signal: AbortSignal.timeout(3000)
            });
            if (!res.ok) throw new Error('Failed stats');
            const data = await res.json();
            const stats = data.data || data;
            renderCharts(stats);
        } catch (error) {
            console.log('API not available, using mock stats for preview');
            const mockStats = { totalLikes:245, totalComments:89, totalViews:1250 };
            renderCharts(mockStats);
        }
    }

    // Render charts
    function renderCharts(stats) {
        renderInteractionPieChart(stats.totalLikes, stats.totalComments, stats.totalViews);
        renderInteractionBarChart(stats);
    }

    // Pie chart
    function renderInteractionPieChart(likes, comments, views) {
        const ctx = document.getElementById('interactionPieChart');
        if (!ctx) return;
        new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ['Likes','Comments','Views'],
                datasets:[{data:[likes,comments,views],backgroundColor:['rgba(255,140,0,0.8)','rgba(255,165,0,0.8)','rgba(255,215,0,0.8)'],borderColor:['rgba(255,140,0,1)','rgba(255,165,0,1)','rgba(255,215,0,1)'],borderWidth:2}]
            },
            options:{responsive:true}
        });
    }

    // Bar chart
    function renderInteractionBarChart(stats) {
        const ctx = document.getElementById('interactionBarChart');
        if (!ctx) return;
        new Chart(ctx, {
            type:'bar',
            data:{
                labels:['Likes','Comments','Views'],
                datasets:[{
                    label:'Interactions',
                    data:[stats.totalLikes,stats.totalComments,stats.totalViews],
                    backgroundColor:['rgba(255,140,0,0.6)','rgba(255,165,0,0.6)','rgba(255,215,0,0.6)'],
                    borderColor:['rgba(255,140,0,1)','rgba(255,165,0,1)','rgba(255,215,0,1)'],
                    borderWidth:2,borderRadius:8
                }]
            },
            options:{responsive:true}
        });
    }

    // On page load
    window.onload = () => {
        console.log('Initializing My Account page...');
        loadUser();
        loadInteractionStats();
        loadUserPosts();
    };
</script>

</body>
</html>
