<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <nav class="col-md-2 d-none d-md-block bg-dark sidebar text-white">
      <div class="position-sticky pt-3">
        <h4 class="text-center py-3">Admin Panel</h4>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link text-white" href="#">🏠 Dashboard</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#">👤 Users</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#">📝 Posts</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#">💬 Comments</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#">🔓 Logout</a></li>
        </ul>
        <div class="mt-5 px-3">
          <hr class="text-white"/>
          <p>👨 Admin: <strong>admin@example.com</strong></p>
          <p>⏰ Time: <span id="timeNow"></span></p>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
      <h2 class="mt-4">Dashboard Overview</h2>
      <div class="row my-4">
        <!-- Cards -->
        <div class="col-md-3"><div class="card bg-primary text-white"><div class="card-body">👥 Users: <strong>102</strong></div></div></div>
        <div class="col-md-3"><div class="card bg-info text-white"><div class="card-body">📝 Posts: <strong>214</strong></div></div></div>
        <div class="col-md-3"><div class="card bg-success text-white"><div class="card-body">✅ Approved: <strong>185</strong></div></div></div>
        <div class="col-md-3"><div class="card bg-danger text-white"><div class="card-body">❌ Rejected: <strong>29</strong></div></div></div>
        <div class="col-md-3 mt-3"><div class="card bg-warning text-dark"><div class="card-body">💬 Comments: <strong>342</strong></div></div></div>
      </div>

      <!-- Posts Table -->
      <h4 class="mt-4">Latest Posts</h4>
      <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr><th>ID</th><th>Title</th><th>Author</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <!-- Posts will be loaded here -->
        </tbody>
      </table>
    </main>
  </div>
</div>

<script>
  const ADMIN_POSTS_URL = "http://localhost:8080/api/admins/posts";

  async function loadAdminPosts() {
    const response = await fetch(ADMIN_POSTS_URL);
    const data = await response.json();
    const posts = data.data;
    const tbody = document.querySelector("table tbody");
    tbody.innerHTML = posts.map(post => `
        <tr>
            <td>${post.id}</td>
            <td>${post.title}</td>
            <td>${post.author}</td>
            <td>
                <span class="badge bg-${post.status === 'PENDING' ? 'warning' : post.status === 'APPROVED' ? 'success' : 'danger'}">
                    ${post.status.charAt(0) + post.status.slice(1).toLowerCase()}
                </span>
            </td>
            <td>
                ${post.status === 'PENDING' ? `
                    <button class="btn btn-success btn-sm" onclick="approvePost(${post.id})">Approve</button>
                    <button class="btn btn-danger btn-sm" onclick="rejectPost(${post.id})">Reject</button>
                ` : ''}
            </td>
        </tr>
    `).join('');
  }

  async function approvePost(id) {
    await fetch(`http://localhost:8080/api/admins/${id}/approve`, { method: "PUT" });
    loadAdminPosts();
  }

  async function rejectPost(id) {
    await fetch(`http://localhost:8080/api/admins/${id}/reject`, { method: "PUT" });
    loadAdminPosts();
  }

  document.addEventListener("DOMContentLoaded", loadAdminPosts);
  document.getElementById("timeNow").innerText = new Date().toLocaleString();
</script>
</body>
</html>
