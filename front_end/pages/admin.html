<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="../images/download.png" type="image/x-icon" />

  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      color: #f6f2e9;
      font-family: Arial, Helvetica, sans-serif;
    }
    /* Sidebar nav button styles */
    .sidebar .nav-link {
      display: block;
      background: linear-gradient(to right, #ff7e5f, #feb47b); /* Orange gradient */
      color: #fff;
      margin: 8px 12px;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: 500;
      text-align: center;
      transition: all 0.3s ease;
    }

    /* Hover effect */
    .sidebar .nav-link:hover {
      background: linear-gradient(to right, #e96443, #904e95); /* Hover gradient */
      transform: scale(1.05);
      text-decoration: none;
      color: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    #localDateTime {
      font-size: 1rem;
      font-weight: bold;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    .navbar-brand, .nav-link, h2, h3, h4, p, .card-header, .table th, .table td {
      color: #f6f2e9;
    }
    .btn-nav {
      background: linear-gradient(135deg, #FF8C00, #D2691E);
      border: 1px solid #D2691E;
      color: white;
      padding: 8px 16px;
      font-weight: bold;
      transition: all 0.3s ease;
      margin-right: 1rem;
    }
    .btn-nav:hover {
      background: linear-gradient(135deg, #D2691E, #FF8C00);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(255, 140, 0, 0.3);
    }
    .btn-logout {
      background-color: #e65b00;
      color: white;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
    }
    .navbar-brand img {
      width: 32px;
    }
    .sidebar {
      background: rgba(128, 92, 49, 0.8);
      backdrop-filter: blur(10px);
      border-right: 1px solid rgb(218, 74, 0);
      height: 100vh;
      position: fixed;
    }
    .main-content {
      padding: 2rem;
    }
    .card {
      background: rgba(45, 45, 45, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    .card-header {
      background: rgba(45, 45, 45, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .stat-card-posts, .stat-card-users {
      border-left: 5px solid #FF8C00;
    }
    .stat-card-posts .fa-pencil-alt, .stat-card-users .fa-check-circle {
      color: #FF8C00;
    }
    .stat-card .fa-hourglass-half {
      color: #FFA500;
    }
    .table, .table th, .table td {
      color: black;
    }
    .table {
      color: #d69f22;
    }
    .table thead th {
      border-bottom: 2px solid #FF8C00;
    }
    .table-striped tbody tr:nth-of-type(odd) {
      background-color: rgba(0, 0, 0, 0.1);
    }
    /* Default desktop sidebar */
    .sidebar {
      min-height: 100vh;
      background: linear-gradient(to right, #e67635, #904e95);
      padding: 1rem;
    }

    /* Main content shift */
    .main-content {
      margin-left: 16.6%; /* col-md-2 width */
      transition: margin-left 0.3s ease;
    }

    /* Mobile view */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0px; /* hidden by default */
        width: 220px;
        height: 100%;
        transition: left 0.3s ease;
        z-index: 1050;
      }

      .sidebar.active {
        left: 0; /* show sidebar when active */
      }

      .main-content {
        margin-left: 0; /* content full width on mobile */
      }

      /* Toggle button */
      .sidebar-toggle {
        position: fixed;
        top: 45px;
        left: 300px;
        background: #e67635;
        border: none;
        color: white;
        padding: 8px 12px;
        border-radius: 6px;
        z-index: 1100;
      }
    }

    /* Responsive Styles */
    @media (max-width: 991px) {
      /* Sidebar collapse into top bar */
      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 2px solid #FF8C00;
      }
      .sidebar .nav-link {
        text-align: left;
        margin: 5px 0;
        border-radius: 6px;
        padding: 8px 12px;
      }
      .main-content {
        margin-left: 0;
        padding: 1rem;
      }
    }

    @media (max-width: 768px) {
      /* Cards stack full width */
      .stat-card-posts,
      .stat-card-users,
      .stat-card {
        margin-bottom: 1rem;
      }
      .row.g-4 > .col-md-4,
      .row.g-4 > .col-md-6 {
        flex: 0 0 100%;
        max-width: 100%;
      }

      /* Chart containers responsive */
      .chart-container {
        height: 250px !important;
      }

      /* Table responsive */
      .table-responsive {
        font-size: 0.9rem;
      }

      /* Chatbot widget smaller on mobile */
      .chatbot-widget {
        width: 90%;
        right: 5%;
        bottom: 10px;
      }
    }

    @media (max-width: 480px) {
      .navbar-brand {
        font-size: 1rem;
      }
      .navbar-brand img {
        width: 24px;
      }
      .btn-logout {
        padding: 6px 10px;
        font-size: 0.85rem;
      }
      .chatbot-widget {
        width: 100%;
        right: 0;
        border-radius: 0;
      }
    }

  </style>
</head>
<body>
<div class="container-fluid"  style="background: linear-gradient(to right, #904e95, #dfd4df);">
  <nav class="navbar navbar-expand-lg navbar-glass">
    <div class="container-fluid">
      <a class="navbar-brand" href="/index.html">
        <img src="../images/download.png" alt="BlogSphere Icon">
        BlogSphere Admin
      </a>


    </div>
  </nav>
  <div class="row">
    <nav class="col-md-2 sidebar bg-dark text-white" style="background: linear-gradient(to right, #e67635,#904e95);">
      <div class="position-sticky pt-3">
        <h4 class="text-center py-3">Admin Panel</h4>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link text-white" href="user.html">👤 Users</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="post_collection.html">📝 Posts</a></li>
        </ul>
        <div class="mt-5 px-3">
          <hr class="text-white"/>
        </div>
        <div id="localDateTime" class="text-end mb-3"></div>
      </div>
      <div class="d-flex">

        <!--        <form action="/logout" method="post" style="display:inline;">-->
        <button type="submit" class="btn btn-logout"><a href="index.html" style=" text-decoration: none;color: white;" id="logoutButton">
          <i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </button>
        <!--        </form>-->
      </div>
    </nav>


    <main class="col-md-10 ms-sm-auto px-md-4 main-content">
<!--      <h2 class="mb-4">Dashboard</h2>-->

      <div class="row g-4 mb-5">
        <div class="col-md-4">
          <div class="card p-3 stat-card-posts">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h3 id="totalPostsCount">0</h3>
                <p class="mb-0">Total Posts</p>
              </div>
              <i class="fas fa-pencil-alt fa-3x"></i>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-3 stat-card">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h3 id="pendingPostsCount">0</h3>
                <p class="mb-0">Pending Posts</p>
              </div>
              <i class="fas fa-hourglass-half fa-3x"></i>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-3 stat-card-users">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h3 id="approvedPostsCount">0</h3>
                <p class="mb-0">Approved Posts</p>
              </div>
              <i class="fas fa-check-circle fa-3x"></i>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-4 mb-5">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Post Status Overview</div>
            <div class="card-body chart-container">
              <canvas id="pieChart"></canvas>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Posts per Author</div>
            <div class="card-body chart-container">
              <canvas id="barChart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">All Posts</div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped table-hover">
              <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
              </thead>
              <tbody>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<script>
  const ADMIN_POSTS_URL = "http://localhost:8080/api/admins/posts";
  const ADMIN_API_BASE = "http://localhost:8080/api/admins";
  let pieChart, barChart;

  function getAuthHeaders() {
    return {
      'Authorization': 'Bearer ' + localStorage.getItem('token'),
      'Content-Type': 'application/json'
    };
  }
  function updateDateTime() {
    const now = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
    document.getElementById('localDateTime').textContent = now.toLocaleDateString('en-US', options);
  }

  setInterval(updateDateTime, 1000); // Update every second
  updateDateTime(); // Initial call
  async function loadAdminDashboard() {
    await loadAdminPosts();
  }

  async function loadAdminPosts() {
    try {
      const response = await fetch(ADMIN_POSTS_URL, {
        headers: getAuthHeaders()
      });
      if (!response.ok) throw new Error("Failed to fetch posts");
      const data = await response.json();
      const posts = data.data || [];

      const totalPostsCount = posts.length;
      const approvedPostsCount = posts.filter(p => p.status === 'APPROVED').length;
      const pendingPostsCount = posts.filter(p => p.status === 'PENDING').length;
      const rejectedPostsCount = totalPostsCount - approvedPostsCount - pendingPostsCount;

      document.getElementById('totalPostsCount').textContent = totalPostsCount;
      document.getElementById('approvedPostsCount').textContent = approvedPostsCount;
      document.getElementById('pendingPostsCount').textContent = pendingPostsCount;

      const tbody = document.querySelector("table tbody");
      tbody.innerHTML = posts.map(post => `
        <tr>
          <td>${post.id}</td>
          <td>${post.title}</td>
          <td>${post.author}</td>
          <td>
            <span class="badge bg-${post.status === 'PENDING' ? 'warning' : post.status === 'APPROVED' ? 'success' : 'danger'}">
              ${post.status.charAt(0) + post.status.slice(1).toLowerCase()}
            </span>
          </td>
          <td>
            ${post.status === 'PENDING' ? `
              <button class="btn btn-success btn-sm me-2" onclick="approvePost(${post.id})">Approve</button>
              <button class="btn btn-danger btn-sm" onclick="rejectPost(${post.id})">Reject</button>
            ` : ''}
          </td>
        </tr>
      `).join('');

      renderPieChart(approvedPostsCount, pendingPostsCount, rejectedPostsCount);
      renderBarChart(posts);

    } catch (error) {
      console.error("Error loading admin posts:", error);
      document.querySelector("table tbody").innerHTML = `<tr><td colspan="5" class="text-center">Failed to load posts.</td></tr>`;
    }
  }

  function renderPieChart(approved, pending, rejected) {
    const ctx = document.getElementById('pieChart').getContext('2d');
    if (pieChart) pieChart.destroy();
    pieChart = new Chart(ctx, {
      type: 'pie',
      data: {
        labels: ['Approved', 'Pending', 'Rejected'],
        datasets: [{
          data: [approved, pending, rejected],
          backgroundColor: [
            'rgba(7,74,27,0.8)',
            'rgba(255, 165, 0, 0.8)',
            'rgb(232,5,5)'
          ],
          borderColor: [
            'rgba(255, 140, 0, 1)',
            'rgba(255, 165, 0, 1)',
            'rgba(255, 69, 0, 1)'
          ],
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'top',
            labels: {
              color: '#f6f2e9',
            }
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                const label = context.label || '';
                const value = context.parsed || 0;
                const total = context.dataset.data.reduce((acc, val) => acc + val, 0);
                const percentage = ((value / total) * 100).toFixed(2);
                return `${label}: ${value} (${percentage}%)`;
              }
            }
          }
        }
      }
    });
  }

  function renderBarChart(posts) {
    const authors = {};
    posts.forEach(post => {
      authors[post.author] = (authors[post.author] || 0) + 1;
    });
    const authorNames = Object.keys(authors);
    const postCounts = Object.values(authors);
    const ctx = document.getElementById('barChart').getContext('2d');
    if (barChart) barChart.destroy();
    barChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: authorNames,
        datasets: [{
          label: 'Posts Count',
          data: postCounts,
          backgroundColor: 'rgb(44,122,234)',
          borderColor: 'rgba(255, 140, 0, 1)',
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true,
            title: { display: true, text: 'Number of Posts', color: '#f6f2e9' },
            ticks: { color: '#f6f2e9' },
            grid: { color: 'rgba(255, 255, 255, 0.1)' }
          },
          x: {
            title: { display: true, text: 'Author', color: '#f6f2e9' },
            ticks: { color: '#f6f2e9' },
            grid: { color: 'rgba(255, 255, 255, 0.1)' }
          }
        },
        plugins: {
          legend: { display: false },
        }
      }
    });
  }

  async function approvePost(id) {
    try {
      await fetch(`${ADMIN_API_BASE}/${id}/approve`, {
        method: "PUT",
        headers: getAuthHeaders()
      });
      await loadAdminPosts();
    } catch (error) {
      console.error("Failed to approve post:", error);
    }
  }

  async function rejectPost(id) {
    try {
      await fetch(`${ADMIN_API_BASE}/${id}/reject`, {
        method: "PUT",
        headers: getAuthHeaders()
      });
      await loadAdminPosts();
    } catch (error) {
      console.error("Failed to reject post:", error);
    }
  }
  document.getElementById('logoutButton').addEventListener('click', async () => {
    try {
      // Clear JWT token from localStorage
      localStorage.removeItem('token');

      // Call Spring Security logout endpoint
      const response = await fetch('/logout', {
        method: 'POST',
        credentials: 'include' // important to include cookies/session
      });

      if (response.ok) {
        // Redirect to index.html after logout
        window.location.href = '/index.html';
      } else {
        console.error('Logout failed');
      }
    } catch (error) {
      console.error('Error during logout:', error);
    }
  });


  window.onload = loadAdminDashboard;
</script>

</body>
</html>
